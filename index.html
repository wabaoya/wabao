<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>掘金挖宝 - 经典黄金矿工自适应版</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --scale: 1;
      --base-width: 414;
      --base-height: 896;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Game Container Scaled Dynamically */
    #game-container {
      position: relative;
      width: calc(414px * var(--scale));
      height: calc(896px * var(--scale));
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      border-radius: calc(16px * var(--scale));
    }

    /* Scaling helper classes */
    .scaled-text-xs { font-size: calc(10px * var(--scale)); }
    .scaled-text-sm { font-size: calc(12px * var(--scale)); }
    .scaled-text-base { font-size: calc(14px * var(--scale)); }
    .scaled-text-lg { font-size: calc(18px * var(--scale)); }
    .scaled-text-xl { font-size: calc(22px * var(--scale)); }
    .scaled-text-2xl { font-size: calc(28px * var(--scale)); }
    .scaled-text-3xl { font-size: calc(36px * var(--scale)); }

    /* Top HUD Area */
    .hud-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(90px * var(--scale));
      padding: calc(12px * var(--scale));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 20;
      border-bottom: calc(2px * var(--scale)) solid rgba(255, 255, 255, 0.1);
    }

    .hud-box {
      background: rgba(255, 255, 255, 0.08);
      border: calc(1px * var(--scale)) solid rgba(255, 255, 255, 0.15);
      border-radius: calc(12px * var(--scale));
      padding: calc(6px * var(--scale)) calc(12px * var(--scale));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: calc(90px * var(--scale));
    }

    /* Miner Container */
    #miner-area {
      position: absolute;
      top: calc(90px * var(--scale));
      left: 0;
      width: 100%;
      height: calc(80px * var(--scale));
      display: flex;
      justify-content: center;
      align-items: flex-start;
      z-index: 15;
    }

    #miner {
      width: calc(60px * var(--scale));
      height: calc(60px * var(--scale));
      background: #f59e0b;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 calc(4px * var(--scale)) calc(12px * var(--scale)) rgba(245, 158, 11, 0.4);
      border: calc(3px * var(--scale)) solid #fbbf24;
      position: relative;
    }

    /* Hook and Rope Canvas Layer */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Mine Field Items Container */
    #mine-field {
      position: absolute;
      top: calc(170px * var(--scale));
      left: 0;
      width: 100%;
      height: calc(626px * var(--scale));
      z-index: 5;
    }

    .item {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      transition: transform 0.1s ease;
      cursor: pointer;
      box-shadow: 0 calc(4px * var(--scale)) calc(8px * var(--scale)) rgba(0,0,0,0.3);
    }

    .item-gold {
      background: radial-gradient(circle at 30% 30%, #fef08a, #d97706);
      border: calc(2px * var(--scale)) solid #f59e0b;
      color: #78350f;
    }

    .item-stone {
      background: radial-gradient(circle at 30% 30%, #94a3b8, #334155);
      border: calc(2px * var(--scale)) solid #64748b;
      color: #e2e8f0;
      border-radius: 35%;
    }

    .item-diamond {
      background: radial-gradient(circle at 30% 30%, #e0f2fe, #0284c7);
      border: calc(2px * var(--scale)) solid #38bdf8;
      color: #ffffff;
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    }

    .item-bag {
      background: radial-gradient(circle at 30% 30%, #f472b6, #be185d);
      border: calc(2px * var(--scale)) solid #f43f5e;
      color: #fff;
      border-radius: 40% 40% 50% 50%;
    }

    .item-tnt {
      background: radial-gradient(circle at 30% 30%, #f87171, #dc2626);
      border: calc(2px * var(--scale)) solid #ef4444;
      color: #fff;
      border-radius: 8px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Controls Area */
    .controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(100px * var(--scale));
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 calc(16px * var(--scale));
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      z-index: 20;
      border-top: calc(2px * var(--scale)) solid rgba(255, 255, 255, 0.1);
    }

    .btn-action {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      font-weight: bold;
      border-radius: calc(16px * var(--scale));
      padding: calc(12px * var(--scale)) calc(24px * var(--scale));
      display: flex;
      align-items: center;
      gap: calc(8px * var(--scale));
      box-shadow: 0 calc(4px * var(--scale)) calc(12px * var(--scale)) rgba(59, 130, 246, 0.4);
      border: calc(2px * var(--scale)) solid #60a5fa;
      cursor: pointer;
      active:scale-95;
      transition: all 0.15s ease;
    }

    .btn-bomb {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-color: #fca5a5;
      box-shadow: 0 calc(4px * var(--scale)) calc(12px * var(--scale)) rgba(239, 68, 68, 0.4);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 85%;
      max-width: calc(360px * var(--scale));
      background: #1e293b;
      border: calc(2px * var(--scale)) solid rgba(255, 255, 255, 0.15);
      border-radius: calc(24px * var(--scale));
      padding: calc(24px * var(--scale));
      text-align: center;
      box-shadow: 0 calc(20px * var(--scale)) calc(25px * var(--scale)) rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }
  </style>
</head>
<body>

  <!-- Main Game Canvas Container -->
  <div id="game-container">
    
    <!-- HUD Header -->
    <div class="hud-bar">
      <div class="hud-box">
        <span class="text-gray-400 scaled-text-xs font-semibold">当前得分</span>
        <span id="score-text" class="text-amber-400 scaled-text-xl font-black">0</span>
      </div>
      <div class="hud-box">
        <span class="text-gray-400 scaled-text-xs font-semibold">目标得分</span>
        <span id="target-text" class="text-emerald-400 scaled-text-xl font-black">1000</span>
      </div>
      <div class="hud-box">
        <span class="text-gray-400 scaled-text-xs font-semibold">剩余时间</span>
        <span id="time-text" class="text-rose-400 scaled-text-xl font-black">60s</span>
      </div>
    </div>

    <!-- Miner Top Area -->
    <div id="miner-area">
      <div id="miner">
        <i class="fa-solid fa-user-ninja text-slate-900 scaled-text-2xl"></i>
      </div>
    </div>

    <!-- Rope & Hook Canvas Overlay -->
    <canvas id="canvas"></canvas>

    <!-- Underground Mining Field -->
    <div id="mine-field"></div>

    <!-- Bottom Action Controls -->
    <div class="controls-bar">
      <button id="btn-bomb" class="btn-action btn-bomb">
        <i class="fa-solid fa-bomb scaled-text-lg"></i>
        <span class="scaled-text-base">炸弹 (<span id="bomb-count">1</span>)</span>
      </button>

      <button id="btn-release" class="btn-action">
        <i class="fa-solid fa-arrow-down scaled-text-lg"></i>
        <span class="scaled-text-base">出爪</span>
      </button>
    </div>

    <!-- Start Modal -->
    <div id="modal-start" class="modal-overlay active">
      <div class="modal-card">
        <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-500/30" style="width: calc(64px * var(--scale)); height: calc(64px * var(--scale));">
          <i class="fa-solid fa-gem scaled-text-3xl"></i>
        </div>
        <h2 class="text-white font-bold scaled-text-2xl mb-2">掘金挖宝</h2>
        <p class="text-gray-400 scaled-text-sm mb-6">看准角度发射钩爪，抓取地下珍贵宝藏！达成目标分数即可通关。</p>
        <button id="btn-start-game" class="btn-action w-full justify-center py-3">
          <span class="scaled-text-lg">开始挖宝</span>
        </button>
      </div>
    </div>

    <!-- Game Over / Level Clear Modal -->
    <div id="modal-result" class="modal-overlay">
      <div class="modal-card">
        <div id="result-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4" style="width: calc(64px * var(--scale)); height: calc(64px * var(--scale));">
          <i id="result-icon-i" class="fa-solid scaled-text-3xl"></i>
        </div>
        <h2 id="result-title" class="text-white font-bold scaled-text-2xl mb-2">挑战失败</h2>
        <p id="result-desc" class="text-gray-400 scaled-text-sm mb-6">未能在规定时间内达成目标分数。</p>

  <script>
    // Dynamic Scaler Logic
    let SCALE = 1;
    const BASE_WIDTH = 414;
    const BASE_HEIGHT = 896;

    function updateScale() {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;
      
      // Math.min(Screen Width / 414, Screen Height / 896)
      SCALE = Math.min(windowW / BASE_WIDTH, windowH / BASE_HEIGHT);
      
      // Inject --scale to CSS variable root
      document.documentElement.style.setProperty('--scale', SCALE);
      
      // Resize Canvas overlay
      const canvas = document.getElementById('canvas');
      const gameContainer = document.getElementById('game-container');
      if (canvas && gameContainer) {
        canvas.width = gameContainer.clientWidth;
        canvas.height = gameContainer.clientHeight;
      }

      // Reposition / Rescale Hook Origin point
      if (gameState) {
        gameState.originX = (BASE_WIDTH / 2) * SCALE;
        gameState.originY = 120 * SCALE;
      }
    }

    window.addEventListener('resize', () => {
      updateScale();
      if (gameState && gameState.status === 'playing') {
        renderItems();
      }
    });

    // Game Physics & State Configuration
    const gameState = {
      status: 'idle', // idle, playing, ended
      score: 0,
      targetScore: 1000,
      timeLeft: 60,
      bombs: 1,
      level: 1,
      
      // Hook Physics Variables (Scaled Base Units)
      originX: 207,
      originY: 120,
      hookAngle: 0, // Radians
      angleSpeed: 0.03,
      angleDirection: 1, // 1 or -1
      
      ropeLength: 30, // Initial length base
      minRopeLength: 30,
      maxRopeLength: 650,
      ropeSpeed: 8,
      
      hookState: 'swinging', // swinging, extending, retracting
      caughtItem: null,
      
      timerId: null,
      animFrameId: null
    };

    // Item Types Definition (Base Sizes and Values)
    const ITEM_TYPES = [
      { type: 'gold', size: 30, value: 100, weight: 1.2, icon: 'fa-coins', class: 'item-gold' },
      { type: 'gold', size: 50, value: 250, weight: 2.2, icon: 'fa-coins', class: 'item-gold' },
      { type: 'gold', size: 70, value: 500, weight: 3.5, icon: 'fa-coins', class: 'item-gold' },
      { type: 'stone', size: 40, value: 20, weight: 3.0, icon: 'fa-mountain', class: 'item-stone' },
      { type: 'stone', size: 65, value: 50, weight: 4.8, icon: 'fa-mountain', class: 'item-stone' },
      { type: 'diamond', size: 28, value: 600, weight: 0.8, icon: 'fa-gem', class: 'item-diamond' },
      { type: 'bag', size: 35, value: 300, weight: 1.0, icon: 'fa-box-open', class: 'item-bag' },
      { type: 'tnt', size: 38, value: 0, weight: 1.0, icon: 'fa-burst', class: 'item-tnt' }
    ];

    let items = [];

    // DOM References
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const mineField = document.getElementById('mine-field');
    const scoreText = document.getElementById('score-text');
    const targetText = document.getElementById('target-text');
    const timeText = document.getElementById('time-text');
    const bombCountText = document.getElementById('bomb-count');

    // Item Generation Strategy
    function generateItems() {
      items = [];
      mineField.innerHTML = '';
      
      const count = 12 + Math.floor(Math.random() * 4); // 12-15 items
      const fieldWidth = BASE_WIDTH;
      const fieldHeight = 550;

      for (let i = 0; i < count; i++) {
        const typeIndex = Math.floor(Math.random() * ITEM_TYPES.length);
        const template = ITEM_TYPES[typeIndex];
        
        let x, y, overlap;
        let attempts = 0;
        
        // Non-overlapping spawn positioning logic
        do {
          overlap = false;
          x = template.size + Math.random() * (fieldWidth - template.size * 2);
          y = template.size + Math.random() * (fieldHeight - template.size * 2);

          for (const item of items) {
            const dist = Math.hypot(x - item.baseX, y - item.baseY);
            if (dist < (template.size + item.baseSize) / 2 + 10) {
              overlap = true;
              break;
            }
          }
          attempts++;
        } while (overlap && attempts < 100);

        const itemObj = {
          id: i,
          ...template,
          baseX: x,
          baseY: y,
          baseSize: template.size,
          caught: false
        };

        items.push(itemObj);
      }

      renderItems();
    }

    // Render Items to UI with dynamic CSS var scaling
    function renderItems() {
      mineField.innerHTML = '';
      items.forEach(item => {
        if (item.caught) return;
        
        const div = document.createElement('div');
        div.className = `item ${item.class}`;
        div.style.left = `calc(${item.baseX}px * var(--scale))`;
        div.style.top = `calc(${item.baseY}px * var(--scale))`;
        div.style.width = `calc(${item.baseSize}px * var(--scale))`;
        div.style.height = `calc(${item.baseSize}px * var(--scale))`;
        
        const icon = document.createElement('i');
        icon.className = `fa-solid ${item.icon} scaled-text-base`;
        div.appendChild(icon);
        
        mineField.appendChild(div);
        item.element = div;
      });
    }

    // Main Game Loop & Hook Physics calculation
    function gameLoop() {
      if (gameState.status !== 'playing') return;

      updateHookPhysics();
      drawRopeAndHook();

      gameState.animFrameId = requestAnimationFrame(gameLoop);
    }

    function updateHookPhysics() {
      // Phase 1: Swinging Angle Animation
      if (gameState.hookState === 'swinging') {
        gameState.hookAngle += gameState.angleSpeed * gameState.angleDirection;
        if (gameState.hookAngle > Math.PI / 2.5) {
          gameState.hookAngle = Math.PI / 2.5;
          gameState.angleDirection = -1;
        } else if (gameState.hookAngle < -Math.PI / 2.5) {
          gameState.hookAngle = -Math.PI / 2.5;
          gameState.angleDirection = 1;
        }
      } 
      // Phase 2: Extending Rope Outward
      else if (gameState.hookState === 'extending') {
        gameState.ropeLength += gameState.ropeSpeed * SCALE;

        // Current tip of hook in screen pixel space
        const hookX = gameState.originX + Math.sin(gameState.hookAngle) * gameState.ropeLength;
        const hookY = gameState.originY + Math.cos(gameState.hookAngle) * gameState.ropeLength;

        // Check Wall Boundaries
        if (
          hookX <= 15 * SCALE || 
          hookX >= (BASE_WIDTH - 15) * SCALE || 
          hookY >= (BASE_HEIGHT - 110) * SCALE ||
          gameState.ropeLength >= gameState.maxRopeLength * SCALE
        ) {
          gameState.hookState = 'retracting';
        }

        // Collision Detection with Underground Items
        for (const item of items) {
          if (item.caught) continue;

          // Convert Item coordinates to top-level canvas coordinate space
          const itemCanvasX = item.baseX * SCALE;
          const itemCanvasY = (item.baseY + 170) * SCALE; // 170px offset for mine-field top
          const itemRadius = (item.baseSize / 2) * SCALE;

          const dist = Math.hypot(hookX - itemCanvasX, hookY - itemCanvasY);
          
          if (dist < itemRadius + (12 * SCALE)) {
            // Caught item!
            item.caught = true;
            if (item.element) item.element.style.display = 'none';
            
            gameState.caughtItem = item;

            // TNT Explosive Logic
            if (item.type === 'tnt') {
              triggerExplosion(itemCanvasX, itemCanvasY);
              gameState.caughtItem = null;
              gameState.hookState = 'retracting';
            } else {
              gameState.hookState = 'retracting';
            }
            break;
          }
        }
      } 
      // Phase 3: Retracting Rope Inward
      else if (gameState.hookState === 'retracting') {
        let currentSpeed = gameState.ropeSpeed;
        
        if (gameState.caughtItem) {
          currentSpeed = gameState.ropeSpeed / gameState.caughtItem.weight;
        }

        gameState.ropeLength -= currentSpeed * SCALE;

        if (gameState.ropeLength <= gameState.minRopeLength * SCALE) {
          gameState.ropeLength = gameState.minRopeLength * SCALE;
          gameState.hookState = 'swinging';

          // Score Rewards Processing
          if (gameState.caughtItem) {
            addScore(gameState.caughtItem.value);
            gameState.caughtItem = null;
          }
        }
      }
    }

    // Canvas Rope & Hook Graphics Rendering
    function drawRopeAndHook() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const hookX = gameState.originX + Math.sin(gameState.hookAngle) * gameState.ropeLength;
      const hookY = gameState.originY + Math.cos(gameState.hookAngle) * gameState.ropeLength;

      // Draw Rope Line
      ctx.beginPath();
      ctx.moveTo(gameState.originX, gameState.originY);
      ctx.lineTo(hookX, hookY);
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = Math.max(2, 3 * SCALE);
      ctx.stroke();

      // Draw Hook Claw Structure
      ctx.save();
      ctx.translate(hookX, hookY);
      ctx.rotate(-gameState.hookAngle);

      // Metal Ring Top
      ctx.beginPath();
      ctx.arc(0, 0, 5 * SCALE, 0, Math.PI * 2);
      ctx.fillStyle = '#94a3b8';
      ctx.fill();

      // Hook Claws Left & Right
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = Math.max(2, 4 * SCALE);

      // Left Claw
      ctx.beginPath();
      ctx.moveTo(-2 * SCALE, 2 * SCALE);
      ctx.quadraticCurveTo(-14 * SCALE, 12 * SCALE, -8 * SCALE, 22 * SCALE);
      ctx.stroke();

      // Right Claw
      ctx.beginPath();
      ctx.moveTo(2 * SCALE, 2 * SCALE);
      ctx.quadraticCurveTo(14 * SCALE, 12 * SCALE, 8 * SCALE, 22 * SCALE);
      ctx.stroke();

      // Draw Caught Item Attached to Hook Center
      if (gameState.caughtItem) {
        const item = gameState.caughtItem;
        ctx.save();
        ctx.translate(0, (item.baseSize / 2 + 5) * SCALE);
        
        // Draw simplified caught item icon onto hook
        ctx.beginPath();
        ctx.arc(0, 0, (item.baseSize / 2) * SCALE, 0, Math.PI * 2);
        ctx.fillStyle = item.type === 'gold' ? '#f59e0b' : item.type === 'diamond' ? '#38bdf8' : '#64748b';
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    // TNT Explosion Blast Effect
    function triggerExplosion(centerX, centerY) {
      // Destroy nearby items within blast radius
      const blastRadius = 100 * SCALE;
      
      items.forEach(item => {
        if (item.caught) return;
        const itemCanvasX = item.baseX * SCALE;
        const itemCanvasY = (item.baseY + 170) * SCALE;
        const dist = Math.hypot(centerX - itemCanvasX, centerY - itemCanvasY);
        
        if (dist <= blastRadius) {
          item.caught = true;
          if (item.element) item.element.style.display = 'none';
        }
      });

      // Visual Blast Marker
      const blastDiv = document.createElement('div');
      blastDiv.style.position = 'absolute';
      blastDiv.style.left = `${centerX}px`;
      blastDiv.style.top = `${centerY}px`;
      blastDiv.style.transform = 'translate(-50%, -50%)';
      blastDiv.style.width = `calc(120px * var(--scale))`;
      blastDiv.style.height = `calc(120px * var(--scale))`;
      blastDiv.style.background = 'radial-gradient(circle, #fef08a 0%, #ef4444 60%, rgba(239,68,68,0) 100%)';
      blastDiv.style.borderRadius = '50%';
      blastDiv.style.zIndex = '30';
      blastDiv.style.pointerEvents = 'none';
      blastDiv.style.animation = 'ping 0.5s cubic-bezier(0, 0, 0.2, 1) forwards';

      document.getElementById('game-container').appendChild(blastDiv);
      setTimeout(() => blastDiv.remove(), 500);
    }

    // Bomb Item Throw Mechanic
    function useBomb() {
      if (gameState.bombs <= 0) return;
      if (gameState.hookState !== 'retracting' || !gameState.caughtItem) return;

      gameState.bombs--;
      bombCountText.textContent = gameState.bombs;

      // Destroy current caught item
      const item = gameState.caughtItem;
      const hookX = gameState.originX + Math.sin(gameState.hookAngle) * gameState.ropeLength;
      const hookY = gameState.originY + Math.cos(gameState.hookAngle) * gameState.ropeLength;

      triggerExplosion(hookX, hookY);

      gameState.caughtItem = null;
    }

    // Score & HUD Updates
    function addScore(value) {
      gameState.score += value;
      scoreText.textContent = gameState.score;
    }

    // Timer Loop
    function startTimer() {
      clearInterval(gameState.timerId);
      gameState.timerId = setInterval(() => {
        gameState.timeLeft--;
        timeText.textContent = `${gameState.timeLeft}s`;

        if (gameState.timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // Launch Hook Event
    function releaseHook() {
      if (gameState.hookState === 'swinging' && gameState.status === 'playing') {
        gameState.hookState = 'extending';
      }
    }

    // Game Lifecycle Management
    function startGame() {
      updateScale();

      gameState.status = 'playing';
      gameState.score = 0;
      gameState.timeLeft = 60;
      gameState.bombs = 2;
      gameState.hookState = 'swinging';
      gameState.ropeLength = gameState.minRopeLength * SCALE;
      gameState.caughtItem = null;

      scoreText.textContent = '0';
      targetText.textContent = gameState.targetScore;
      timeText.textContent = '60s';
      bombCountText.textContent = gameState.bombs;

      document.getElementById('modal-start').classList.remove('active');
      document.getElementById('modal-result').classList.remove('active');

      generateItems();
      startTimer();
      cancelAnimationFrame(gameState.animFrameId);
      gameLoop();
    }

    function endGame() {
      gameState.status = 'ended';
      clearInterval(gameState.timerId);
      cancelAnimationFrame(gameState.animFrameId);

      const modalResult = document.getElementById('modal-result');
      const resultTitle = document.getElementById('result-title');
      const resultDesc = document.getElementById('result-desc');
      const resultIcon = document.getElementById('result-icon');
      const resultIconI = document.getElementById('result-icon-i');
      const qrContainer = document.getElementById('qr-container');

      const isSuccess = gameState.score >= gameState.targetScore;

      if (isSuccess) {
        resultTitle.textContent = '挑战成功！';
        resultTitle.className = 'text-emerald-400 font-bold scaled-text-2xl mb-2';
        resultDesc.textContent = `太棒了！您最终获得 ${gameState.score} 分，成功解锁掘金专属宝藏礼包！`;
        
        resultIcon.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        resultIconI.className = 'fa-solid fa-trophy scaled-text-3xl';
        
        qrContainer.classList.remove('hidden');
      } else {
        resultTitle.textContent = '挑战失败';
        resultTitle.className = 'text-rose-400 font-bold scaled-text-2xl mb-2';
        resultDesc.textContent = `未能达成 ${gameState.targetScore} 分的目标（当前: ${gameState.score}分），继续努力！`;
        
        resultIcon.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-rose-500/20 text-rose-400 border border-rose-500/30';
        resultIconI.className = 'fa-solid fa-circle-xmark scaled-text-3xl';
        
        qrContainer.classList.add('hidden');
      }

      modalResult.classList.add('active');
    }

    // Attach Event Handlers
    document.getElementById('btn-start-game').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);
    document.getElementById('btn-release').addEventListener('click', releaseHook);
    document.getElementById('btn-bomb').addEventListener('click', useBomb);

    // Keyboard Space / Tap Control
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowDown') {
        releaseHook();
      } else if (e.code === 'KeyB') {
        useBomb();
      }
    });

    // Touch Tap to Fire Hook on Minefield Area
    document.getElementById('game-container').addEventListener('click', (e) => {
      // Prevent triggering when clicking buttons or modals
      if (e.target.closest('.btn-action') || e.target.closest('.modal-card')) return;
      releaseHook();
    });

    // Initial Dynamic Rescaling calculation on Load
    window.onload = function() {
      updateScale();
    };
  </script>
</body>
</html>

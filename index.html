<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>挖宝 · 挑战版</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei",sans-serif;
}
body{
    overflow:hidden;
    background:radial-gradient(circle at top,#4b2b00,#111 60%);
    color:#fff;
}
#gameWrap{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}
.topBar{
    background:#1c1c1c;
    border-bottom:3px solid gold;
    padding:10px;
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    z-index:100;
}
.info{
    font-size:18px;
    font-weight:bold;
}
.info span{
    color:#ffd700;
}
#gameArea{
    flex:1;
    position:relative;
    overflow:hidden;
    background:linear-gradient(to bottom,#382200 0%,#111 40%);
}
#tip{
    position:absolute;
    top:95px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 22px;
    background:rgba(0,0,0,0.7);
    border-radius:30px;
    font-size:20px;
    color:#ffd700;
    z-index:300;
    white-space:nowrap;
    opacity:0;
    transition:0.3s;
}
.miner{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:100px;
    height:80px;
    z-index:100;
}
.minerBody{
    width:100%;
    height:100%;
    background:#8b5a2b;
    border-radius:0 0 20px 20px;
    border:4px solid #ffcc66;
    box-shadow:0 0 30px rgba(255,215,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
}
.logo-yuanbao{
    width:50px;
    height:38px;
    position:relative;
    filter:drop-shadow(0 2px 6px rgba(218,165,32,0.6));
}
.logo-yuanbao .yb-body{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:28px;
    background:linear-gradient(to bottom, #ffd700 0%, #ffaa00 40%, #ff8800 100%);
    border-radius:10px 10px 25px 25px;
    box-shadow:inset -8px 0 12px rgba(255,255,255,0.3), inset 8px 0 8px rgba(200,100,0,0.2), 0 3px 8px rgba(184,134,11,0.4);
}
.logo-yuanbao .yb-ear-left, .logo-yuanbao .yb-ear-right{
    position:absolute;
    top:8px;
    width:18px;
    height:22px;
    background:linear-gradient(to bottom, #ffcc00, #ff9900);
    border-radius:50% 50% 30% 30%;
}
.logo-yuanbao .yb-ear-left{ left:-2px; transform:rotate(-25deg); box-shadow:inset 3px 0 6px rgba(255,255,255,0.35); }
.logo-yuanbao .yb-ear-right{ right:-2px; transform:rotate(25deg); box-shadow:inset -3px 0 6px rgba(255,255,255,0.35); }
.logo-yuanbao .yb-top{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:32px;
    height:18px;
    background:linear-gradient(to bottom, #ffee88, #ffd700 50%, #ffcc00);
    border-radius:50% 50% 40% 40%;
}
.logo-yuanbao .yb-shine{
    position:absolute;
    top:6px;
    left:50%;
    transform:translateX(-50%);
    width:24px;
    height:10px;
    background:radial-gradient(ellipse, rgba(255,255,255,0.7), transparent);
    border-radius:50%;
    filter:blur(1px);
}
.ropeWrap{
    position:absolute;
    left:50%;
    top:72px;
    transform-origin:top center;
    z-index:90;
}
.swing{ animation:swing 2.6s infinite ease-in-out; }
@keyframes swing{
    0%{ transform:translateX(-50%) rotate(-65deg); }
    50%{ transform:translateX(-50%) rotate(65deg); }
    100%{ transform:translateX(-50%) rotate(-65deg); }
}
.rope{
    width:6px;
    height:140px;
    margin:auto;
    border-radius:20px;
    background:repeating-linear-gradient(to bottom, #f7d08a 0px, #f7d08a 6px, #8b5a2b 6px, #8b5a2b 12px);
    box-shadow:0 0 12px rgba(255,215,0,0.7);
}
.claw{ width:50px; height:54px; position:relative; margin-top:-6px; margin-left:-4px; filter:drop-shadow(0 0 8px rgba(255,215,0,0.75)); }
.claw-ring{
    width:18px; height:18px; background:radial-gradient(circle at 35% 25%, #fff8c6, #ffd700 45%, #b8860b 100%); border-radius:50%;
    position:absolute; top:0; left:50%; transform:translateX(-50%); border:2px solid #fff4aa; box-shadow:0 0 12px rgba(255,215,0,0.95), inset 0 2px 4px rgba(255,255,255,0.55); z-index:3;
}
.claw-connector{
    width:7px; height:16px; background:linear-gradient(to bottom, #fff3a0, #ffd700 45%, #b8860b);
    position:absolute; top:17px; left:50%; transform:translateX(-50%); border-radius:4px;
    border:1px solid #8b6914; box-shadow:inset 0 2px 4px rgba(255,255,255,0.45);
}
.claw-finger{
    width:9px; height:25px; background:linear-gradient(to bottom, #fff6b7 0%, #ffd700 38%, #d69b00 75%, #8b6914 100%);
    position:absolute; top:30px; border-radius:8px 8px 12px 12px; border:1px solid #8b6914;
    box-shadow:inset 2px 0 4px rgba(255,255,255,0.45), inset -2px 0 4px rgba(120,75,0,0.35);
}
.claw-finger.left{ left:9px; transform:rotate(-38deg); transform-origin:top center; }
.claw-finger.right{ right:9px; transform:rotate(38deg); transform-origin:top center; }
.claw-finger.middle{ left:50%; transform:translateX(-50%); height:27px; top:31px; }
.claw.closed .claw-finger.left{ transform:rotate(-13deg); transition:0.18s; }
.claw.closed .claw-finger.right{ transform:rotate(13deg); transition:0.18s; }
.claw.closed .claw-finger.middle{ transform:translateX(-50%) translateY(3px); transition:0.18s; }
.item{ position:absolute; display:flex; align-items:center; justify-content:center; user-select:none; }
.coin {
    border-radius: 50%; border: 2px solid #ffcc00;
    background: radial-gradient(circle at 35% 25%, #fffacd, #ffd700 70%, #b8860b);
    box-shadow: 0 4px 10px rgba(255, 215, 0, 0.4), inset 0 0 6px rgba(0,0,0,0.15);
}
.coin::after { content: '🪙'; font-size: 20px; }
.yuanbao{
    background:radial-gradient(ellipse at 35% 25%, #fffacd, #ffd700 45%, #daa520 80%, #b8860b);
    border-radius:50% 50% 45% 45%; box-shadow:0 6px 16px rgba(218,165,32,0.5), 0 0 25px rgba(255,215,0,0.35); position:relative;
}
.yuanbao::before{
    content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:38px; height:18px;
    background:radial-gradient(ellipse at center, #fffacd, #ffd700 70%, #daa520); border-radius:50% 50% 40% 40%;
}
.yuanbao::after{ content:'¥'; position:absolute; top:50%; left:50%; transform:translate(-50%, -40%); font-size:18px; font-weight:bold; color:#8b6914; }
.diamond{
    background:linear-gradient(135deg, #e0ffff 0%, #00ced1 30%, #008b8b 70%, #20b2aa 100%);
    clip-path:polygon(50% 0%, 100% 35%, 85% 100%, 15% 100%, 0% 35%); animation:diamondShine 2.5s infinite ease-in-out;
}
.diamond::after{ content:'💎'; font-size:24px; filter:drop-shadow(0 0 6px rgba(255,255,255,0.9)); transform:translateY(2px); }
@keyframes diamondShine{ 0%, 100%{ filter:brightness(1); } 50%{ filter:brightness(1.4); } }
.gift { background: linear-gradient(135deg, #ff4500, #ff0000); border-radius: 10px; box-shadow: 0 6px 14px rgba(255,0,0,0.35); }
.gift::after { content: '🎁'; font-size: 24px; }
.crown{
    background:linear-gradient(to bottom, #ffd700, #ff8c00 60%, #ff6b00);
    clip-path:polygon(0% 75%, 8% 35%, 22% 55%, 38% 15%, 50% 45%, 62% 15%, 78% 55%, 92% 35%, 100% 75%, 100% 100%, 0% 100%); position:relative;
}
.crown::after{ content:'👑'; font-size:22px; position:absolute; top:55%; left:50%; transform:translate(-50%, -50%); }
.bomb{ background:radial-gradient(circle at 30% 30%, #777, #333 55%, #111); border-radius:50%; animation:bombPulse 1.8s infinite ease-in-out; position:relative; }
.bomb::before{ content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:10px; height:14px; background:linear-gradient(to right, #8b4513, #a0522d); border-radius:3px 3px 0 0; }
.bomb::after{ content:''; position:absolute; top:-18px; left:58%; width:8px; height:10px; background:radial-gradient(circle, #ff6347, #ff0000); border-radius:50%; box-shadow:0 0 12px #ff0000; animation:fuseBurn 0.6s infinite alternate; }
@keyframes bombPulse{ 0%, 100%{ box-shadow:0 0 30px rgba(255,0,0,0.5); } 50%{ box-shadow:0 0 45px rgba(255,0,0,0.75); } }
@keyframes fuseBurn{ 0%{ opacity:0.7; transform:scale(0.9); } 100%{ opacity:1; transform:scale(1.3); } }
#controls{ background:#111; border-top:3px solid gold; padding:12px; display:flex; justify-content:center; }
button{ border:none; padding:14px 40px; border-radius:14px; font-size:20px; font-weight:bold; cursor:pointer; transition:0.2s; }
button:hover{ transform:scale(1.05); }
button:active{ transform:scale(0.95); }
.mineBtn{ background:#ff9800; color:#fff; box-shadow:0 4px 15px rgba(255,152,0,0.4); }
.reviveBtn{ background:#e53935; color:#fff; padding:14px 28px; font-size:18px; }
#exchangePanel{ display:none; margin-top:18px; flex-direction:column; align-items:center; gap:10px; }
.exchangeRow{ display:flex; gap:10px; align-items:center; }
#exchangeInput{ width:130px; padding:10px; border:none; border-radius:10px; font-size:16px; text-align:center; }
.exchangeBtn{ background:#2ecc71; color:#fff; padding:12px 20px; border-radius:12px; font-size:16px; }
#exchangeTip{ font-size:15px; color:#ff9800; }
#qrModal{ position:absolute; inset:0; background:rgba(0,0,0,0.92); display:none; z-index:600; justify-content:center; align-items:center; flex-direction:column; }
#qrModal img{ width:280px; height:280px; border-radius:16px; }
.qr-text{ margin-top:20px; font-size:22px; color:#ffd700; }
.qr-timer{ margin-top:15px; font-size:48px; font-weight:bold; color:#ff6347; }
#gameOver{ position:absolute; inset:0; background:rgba(0,0,0,0.88); display:none; z-index:500; justify-content:center; align-items:center; flex-direction:column; }
#gameOver h1{ font-size:60px; color:red; margin-bottom:20px; }
#gameOver p{ font-size:28px; margin-bottom:30px; }
@media(max-width:700px){
    .info{ font-size:14px; }
    button{ font-size:16px; padding:12px 32px; }
    .reviveBtn{ font-size:16px; padding:12px 24px; }
    .exchangeBtn{ font-size:14px; padding:10px 16px; }
    #exchangeInput{ width:100px; font-size:14px; }
    #tip{ font-size:15px; }
    #qrModal img{ width:220px; height:220px; }
    .qr-text{ font-size:18px; }
    .qr-timer{ font-size:36px; }
}
</style>
</head>

<body>

" alt="二维码">
    <p class="qr-text">请扫描二维码付款</p>
    <p class="qr-timer" id="qrTimer">180</p>
</div>

<div id="gameOver">
    <h1>💥 GAME OVER 💥</h1>
    <p>你抓到了3个炸弹！</p>
    <button class="reviveBtn" onClick="reviveGame()">❤️ 100金币复活</button>
    
    <div id="exchangePanel">
        <p>金币不足，可用存款兑换</p>
        <div class="exchangeRow">
            <input type="number" id="exchangeInput" placeholder="金额">
            <button class="exchangeBtn" onClick="exchangeMoney()">🏦 存款兑换</button>
        </div>
        <p id="exchangeTip"></p>
    </div>
</div>
</div>

<div id="controls">
    <button class="mineBtn" onClick="throwHook()">🪝 放钩</button>
</div>
</div>

<script>
let handMoney=0, combo=0, bombCount=0, isHooking=false, ropeLen=140, mineList=[], lockAngle=0;
let playStartTime = Date.now(); // 记录单局游戏开始时间

const gameArea = document.getElementById('gameArea'), ropeWrap = document.getElementById('ropeWrap'), rope = document.getElementById('rope'), hook = document.getElementById('hook');
const handDom = document.getElementById('handMoney'), comboDom = document.getElementById('combo'), bombDom = document.getElementById('bombCount'), tip = document.getElementById('tip');

let tipTimer=null, qrCountdownTimer=null;

function updateUI(){
    handDom.innerText=handMoney;
    comboDom.innerText=combo;
    bombDom.innerText=bombCount;
}

function random(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function showTip(text){
    clearTimeout(tipTimer);
    tip.innerHTML=text;
    tip.style.opacity=1;
    tipTimer=setTimeout(()=>{ tip.style.opacity=0; },2000);
}

function createMine(){
    let item=document.createElement('div');
    let type=Math.random(), value=0, weight=0, className='', size=0;

    // 计算玩家已游玩秒数
    let elapsedSeconds = (Date.now() - playStartTime) / 1000;
    
    // 依据时间调整炸弹判定线（默认0.22的概率区间）
    let bombThreshold = 0.22; 
    if (elapsedSeconds >= 20) {
        bombThreshold = 0.66; // 20秒后，炸弹概率增加二倍 (22% * 3 = 66%)
    } else if (elapsedSeconds >= 10) {
        bombThreshold = 0.44; // 10秒后，炸弹概率增加一倍 (22% * 2 = 44%)
    }

    // 动态生成概率区间分配
    if (type < bombThreshold) {
        className='item bomb'; value=0; weight=10; size=random(44,52);
    } else {
        // 剩余的区间平分给其他收益性物品
        let remain = (type - bombThreshold) / (1 - bombThreshold);
        if (remain < 0.38) {
            className='item coin'; value=random(1,2); weight=5; size=random(38,46);
        } else if (remain < 0.68) {
            className='item yuanbao'; value=random(3,6); weight=7; size=random(52,68);
        } else if (remain < 0.84) {
            className='item diamond'; value=random(8,16); weight=4; size=random(42,55);
        } else if (remain < 0.93) {
            className='item gift'; value=random(12,32); weight=6; size=random(44,52);
        } else {
            className='item crown'; value=random(27,55); weight=3; size=random(48,58);
        }
    }

    item.className=className;
    item.style.width=size+'px';
    item.style.height=size+'px';
    item.style.left=random(25,gameArea.clientWidth-100)+'px';
    item.style.top=random(gameArea.clientHeight*0.35,gameArea.clientHeight-160)+'px';

    item.dataset.value=value;
    item.dataset.weight=weight;
    gameArea.appendChild(item);
    mineList.push(item);
}

function initMines(){
    const count = random(12, 14);
    for(let i=0; i<count; i++) createMine();
}

function clearMines(){
    mineList.forEach(item => item.parentNode && item.remove());
    mineList=[];
}

function getHookPoint(){
    const rad = lockAngle * Math.PI / 180;
    return {
        x: (gameArea.clientWidth / 2) + Math.sin(rad) * (ropeLen + 46),
        y: 72 + Math.cos(rad) * (ropeLen + 46)
    };
}

// 更精准的抓取模型：只用金色抓手三个指尖的“运动轨迹”触碰物品边界
// 这样不会再因为中心点距离过大而出现“隔空抓中”的情况。
function getClawTipPoint(len, lateralOffset, forwardOffset){
    const rad = lockAngle * Math.PI / 180;
    const ux = Math.sin(rad);      // 抓钩前进方向
    const uy = Math.cos(rad);
    const px = Math.cos(rad);      // 垂直于前进方向，用于左右指尖偏移
    const py = -Math.sin(rad);
    const baseX = gameArea.clientWidth / 2;
    const baseY = 72;

    return {
        x: baseX + ux * (len + forwardOffset) + px * lateralOffset,
        y: baseY + uy * (len + forwardOffset) + py * lateralOffset
    };
}

function getClawCatchSegments(prevLen, currLen){
    // left / middle / right 三个指尖。左右指尖的偏移收窄，命中更贴近可见抓手。
    const fingers = [
        { lateral:-8, forward:51, priority:1 },
        { lateral: 0, forward:59, priority:0 },
        { lateral: 8, forward:51, priority:1 }
    ];
    return fingers.map(f => ({
        from:getClawTipPoint(prevLen, f.lateral, f.forward),
        to:getClawTipPoint(currLen, f.lateral, f.forward),
        priority:f.priority
    }));
}

function isPointInsideItemEllipse(point, rect, gameRect){
    const itemX = rect.left + rect.width / 2 - gameRect.left;
    const itemY = rect.top + rect.height / 2 - gameRect.top;

    // 只给 2px 容错，基本等同于指尖碰到物品边缘才算抓中
    const tolerance = 2;
    const rx = Math.max(8, rect.width / 2 + tolerance);
    const ry = Math.max(8, rect.height / 2 + tolerance);
    const nx = (point.x - itemX) / rx;
    const ny = (point.y - itemY) / ry;
    return (nx * nx + ny * ny) <= 1;
}

function segmentHitsItem(segment, rect, gameRect){
    const dx = segment.to.x - segment.from.x;
    const dy = segment.to.y - segment.from.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const steps = Math.max(1, Math.ceil(dist / 3)); // 扫描轨迹，防止快速发射时穿过物品漏判

    for(let i=0; i<=steps; i++){
        const t = i / steps;
        const point = {
            x: segment.from.x + dx * t,
            y: segment.from.y + dy * t
        };
        if(isPointInsideItemEllipse(point, rect, gameRect)){
            const itemX = rect.left + rect.width / 2 - gameRect.left;
            const itemY = rect.top + rect.height / 2 - gameRect.top;
            return Math.hypot(point.x - itemX, point.y - itemY) + segment.priority * 4;
        }
    }
    return Infinity;
}

function throwHook(){
    if(isHooking) return;
    isHooking=true;

    const matrix = new DOMMatrix(window.getComputedStyle(ropeWrap).transform);
    lockAngle = Math.atan2(matrix.m21, matrix.m11) * 180 / Math.PI;

    ropeWrap.classList.remove('swing');
    ropeWrap.style.transform = `translateX(-50%) rotate(${lockAngle}deg)`;
    ropeLen = 140;
    hook.classList.remove('closed');

    function extend(){
        const prevLen = ropeLen;
        ropeLen += 8;
        rope.style.height = ropeLen + 'px';
        ropeWrap.style.transform = `translateX(-50%) rotate(${lockAngle}deg)`;

        const target = detectCollision(prevLen, ropeLen);
        if(target){
            hook.classList.add('closed');
            pullBack(target);
            return;
        }
        if(ropeLen >= gameArea.clientHeight + 80){
            pullBack(null);
            return;
        }
        requestAnimationFrame(extend);
    }
    extend();
}

function detectCollision(prevLen, currLen){
    const segments = getClawCatchSegments(prevLen, currLen);
    const gameRect = gameArea.getBoundingClientRect();
    let nearestTarget = null;
    let nearestScore = Infinity;

    for(let item of mineList){
        const rect = item.getBoundingClientRect();

        for(const segment of segments){
            const score = segmentHitsItem(segment, rect, gameRect);
            if(score < nearestScore){
                nearestTarget = item;
                nearestScore = score;
            }
        }
    }
    return nearestTarget;
}
function pullBack(target){
    let speed = target ? parseInt(target.dataset.weight || 10) : 10;
    function retract(){
        ropeLen -= speed;
        rope.style.height = ropeLen + 'px';
        ropeWrap.style.transform = `translateX(-50%) rotate(${lockAngle}deg)`;

        if(target){
            const point = getHookPoint();
            target.style.left = (point.x - target.offsetWidth/2) + 'px';
            target.style.top = (point.y - target.offsetHeight/2) + 'px';
        }

        if(ropeLen <= 140){
            finishGrab(target);
            return;
        }
        requestAnimationFrame(retract);
    }
    retract();
}

function finishGrab(target){
    hook.classList.remove('closed');
    if(target){
        if(target.className.includes('bomb')){
            bombCount++; combo=0;
            showTip(`💣 抓到炸弹 (${bombCount}/3)`);
            if(bombCount>=3){ gameOver(); return; }
        }else{
            let value = parseInt(target.dataset.value);
            combo++;
            let multi = combo>=10 ? 3 : combo>=6 ? 2 : combo>=3 ? 1.5 : 1;
            if(Math.random() > 0.9){ multi *= 2; showTip("🔥 暴击翻倍！"); }

            const final = Math.floor(value * multi);
            handMoney += final;
            showTip(target.className.includes('gift') ? `🎁 拆开精简礼盒！获得 ${final} 金币` : `获得 ${final} 金币`);
        }
        target.remove();
        mineList = mineList.filter(v=>v!==target);
        createMine();
    }else{
        combo=0;
        showTip("空钩返回");
    }

    resetHookState();
    updateUI();
}

function resetHookState(){
    rope.style.height='140px';
    ropeWrap.style.transform = '';
    ropeWrap.classList.add('swing');
    isHooking=false;
}

function gameOver(){
    isHooking=true;
    document.getElementById('gameOver').style.display='flex';
}

function reviveGame(){
    if(handMoney >= 100){
        handMoney -= 100;
        bombCount = 0; combo = 0; isHooking = false;
        playStartTime = Date.now(); // 复活重置难度计时
        clearMines(); initMines(); resetHookState();
        document.getElementById('gameOver').style.display = 'none';
        document.getElementById('exchangePanel').style.display = 'none';
        updateUI();
        showTip("❤️ 已复活！再来一局！");
    } else {
        document.getElementById('exchangePanel').style.display = 'flex';
        document.getElementById('exchangeTip').innerText = `还差 ${100 - handMoney} 金币，可点击下方兑换支持`;
    }
}

function exchangeMoney(){
    document.getElementById('exchangePanel').style.display = 'none';
    document.getElementById('gameOver').style.display = 'none';
    const qrModal = document.getElementById('qrModal');
    const timerEl = document.getElementById('qrTimer');
    let count = 180;
    
    qrModal.style.display = 'flex';
    timerEl.innerText = count;
    
    clearInterval(qrCountdownTimer);
    qrCountdownTimer = setInterval(() => {
        count--;
        timerEl.innerText = count;
        if(count <= 0){
            clearInterval(qrCountdownTimer);
            handMoney = 0; combo = 0; bombCount = 0; isHooking = false;
            playStartTime = Date.now(); // 新游戏重置难度计时
            clearMines(); initMines(); resetHookState();
            document.getElementById('qrModal').style.display = 'none';
            updateUI();
            showTip("🔄 倒计时结束，新游戏开始！");
        }
    }, 1000);
}

updateUI();
initMines();
showTip("看准摇摆方向发射抓手！");
</script>
</body>
</html>

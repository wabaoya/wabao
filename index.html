<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>挖宝 · 挑战版</title>

<style>
/* =====================================================================
   自适应核心：用 CSS 变量统一管理所有尺寸，JS 启动时写入实际值
   ===================================================================== */
:root {
    --scale: 1;           /* JS 动态计算后写入 */
    --miner-w: 100px;
    --miner-h: 80px;
    --rope-init: 140px;
    --topbar-h: 56px;
    --ctrl-h: 64px;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei",sans-serif;
}
html, body {
    width:100%;
    height:100%;
    overflow:hidden;
}
body{
    background:radial-gradient(circle at top,#4b2b00,#111 60%);
    color:#fff;
}
#gameWrap{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    /* 整体缩放入口 */
    transform-origin: top left;
}
.topBar{
    background:#1c1c1c;
    border-bottom:3px solid gold;
    padding:calc(10px * var(--scale));
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    flex-shrink:0;
    z-index:100;
}
.info{
    font-size:calc(18px * var(--scale));
    font-weight:bold;
}
.info span{
    color:#ffd700;
}
#gameArea{
    flex:1;
    position:relative;
    overflow:hidden;
    background:linear-gradient(to bottom,#382200 0%,#111 40%);
    min-height:0;
}
#tip{
    position:absolute;
    top:calc(95px * var(--scale));
    left:50%;
    transform:translateX(-50%);
    padding:calc(10px * var(--scale)) calc(22px * var(--scale));
    background:rgba(0,0,0,0.7);
    border-radius:30px;
    font-size:calc(20px * var(--scale));
    color:#ffd700;
    z-index:300;
    white-space:nowrap;
    opacity:0;
    transition:0.3s;
}
.miner{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:calc(100px * var(--scale));
    height:calc(80px * var(--scale));
    z-index:100;
}
.minerBody{
    width:100%;
    height:100%;
    background:#8b5a2b;
    border-radius:0 0 20px 20px;
    border:calc(4px * var(--scale)) solid #ffcc66;
    box-shadow:0 0 30px rgba(255,215,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
}
.logo-yuanbao{
    width:calc(50px * var(--scale));
    height:calc(38px * var(--scale));
    position:relative;
    filter:drop-shadow(0 2px 6px rgba(218,165,32,0.6));
}
.logo-yuanbao .yb-body{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:calc(50px * var(--scale));
    height:calc(28px * var(--scale));
    background:linear-gradient(to bottom, #ffd700 0%, #ffaa00 40%, #ff8800 100%);
    border-radius:10px 10px 25px 25px;
    box-shadow:inset -8px 0 12px rgba(255,255,255,0.3), inset 8px 0 8px rgba(200,100,0,0.2), 0 3px 8px rgba(184,134,11,0.4);
}
.logo-yuanbao .yb-ear-left, .logo-yuanbao .yb-ear-right{
    position:absolute;
    top:calc(8px * var(--scale));
    width:calc(18px * var(--scale));
    height:calc(22px * var(--scale));
    background:linear-gradient(to bottom, #ffcc00, #ff9900);
    border-radius:50% 50% 30% 30%;
}
.logo-yuanbao .yb-ear-left{ left:calc(-2px * var(--scale)); transform:rotate(-25deg); box-shadow:inset 3px 0 6px rgba(255,255,255,0.35); }
.logo-yuanbao .yb-ear-right{ right:calc(-2px * var(--scale)); transform:rotate(25deg); box-shadow:inset -3px 0 6px rgba(255,255,255,0.35); }
.logo-yuanbao .yb-top{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:calc(32px * var(--scale));
    height:calc(18px * var(--scale));
    background:linear-gradient(to bottom, #ffee88, #ffd700 50%, #ffcc00);
    border-radius:50% 50% 40% 40%;
}
.logo-yuanbao .yb-shine{
    position:absolute;
    top:calc(6px * var(--scale));
    left:50%;
    transform:translateX(-50%);
    width:calc(24px * var(--scale));
    height:calc(10px * var(--scale));
    background:radial-gradient(ellipse, rgba(255,255,255,0.7), transparent);
    border-radius:50%;
    filter:blur(1px);
}
.ropeWrap{
    position:absolute;
    left:50%;
    top:calc(72px * var(--scale));
    transform-origin:top center;
    z-index:90;
}
.swing{ animation:swing 2.6s infinite ease-in-out; }
@keyframes swing{
    0%{ transform:translateX(-50%) rotate(-65deg); }
    50%{ transform:translateX(-50%) rotate(65deg); }
    100%{ transform:translateX(-50%) rotate(-65deg); }
}
.rope{
    width:calc(6px * var(--scale));
    height:calc(140px * var(--scale));
    margin:auto;
    border-radius:20px;
    background:repeating-linear-gradient(to bottom, #f7d08a 0px, #f7d08a 6px, #8b5a2b 6px, #8b5a2b 12px);
    box-shadow:0 0 12px rgba(255,215,0,0.7);
}
.claw{
    width:calc(50px * var(--scale));
    height:calc(54px * var(--scale));
    position:relative;
    margin-top:calc(-6px * var(--scale));
    margin-left:calc(-4px * var(--scale));
    filter:drop-shadow(0 0 8px rgba(255,215,0,0.75));
}
.claw-ring{
    width:calc(18px * var(--scale)); height:calc(18px * var(--scale));
    background:radial-gradient(circle at 35% 25%, #fff8c6, #ffd700 45%, #b8860b 100%); border-radius:50%;
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    border:calc(2px * var(--scale)) solid #fff4aa;
    box-shadow:0 0 12px rgba(255,215,0,0.95), inset 0 2px 4px rgba(255,255,255,0.55); z-index:3;
}
.claw-connector{
    width:calc(7px * var(--scale)); height:calc(16px * var(--scale));
    background:linear-gradient(to bottom, #fff3a0, #ffd700 45%, #b8860b);
    position:absolute; top:calc(17px * var(--scale)); left:50%; transform:translateX(-50%); border-radius:4px;
    border:1px solid #8b6914; box-shadow:inset 0 2px 4px rgba(255,255,255,0.45);
}
.claw-finger{
    width:calc(9px * var(--scale)); height:calc(25px * var(--scale));
    background:linear-gradient(to bottom, #fff6b7 0%, #ffd700 38%, #d69b00 75%, #8b6914 100%);
    position:absolute; top:calc(30px * var(--scale)); border-radius:8px 8px 12px 12px; border:1px solid #8b6914;
    box-shadow:inset 2px 0 4px rgba(255,255,255,0.45), inset -2px 0 4px rgba(120,75,0,0.35);
}
.claw-finger.left{ left:calc(9px * var(--scale)); transform:rotate(-38deg); transform-origin:top center; }
.claw-finger.right{ right:calc(9px * var(--scale)); transform:rotate(38deg); transform-origin:top center; }
.claw-finger.middle{ left:50%; transform:translateX(-50%); height:calc(27px * var(--scale)); top:calc(31px * var(--scale)); }
.claw.closed .claw-finger.left{ transform:rotate(-13deg); transition:0.18s; }
.claw.closed .claw-finger.right{ transform:rotate(13deg); transition:0.18s; }
.claw.closed .claw-finger.middle{ transform:translateX(-50%) translateY(3px); transition:0.18s; }
.item{ position:absolute; display:flex; align-items:center; justify-content:center; user-select:none; }
.coin {
    border-radius: 50%; border: 2px solid #ffcc00;
    background: radial-gradient(circle at 35% 25%, #fffacd, #ffd700 70%, #b8860b);
    box-shadow: 0 4px 10px rgba(255, 215, 0, 0.4), inset 0 0 6px rgba(0,0,0,0.15);
}
.coin::after { content: '🪙'; font-size: calc(20px * var(--scale)); }
.yuanbao{
    background:radial-gradient(ellipse at 35% 25%, #fffacd, #ffd700 45%, #daa520 80%, #b8860b);
    border-radius:50% 50% 45% 45%; box-shadow:0 6px 16px rgba(218,165,32,0.5), 0 0 25px rgba(255,215,0,0.35); position:relative;
}
.yuanbao::before{
    content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:38px; height:18px;
    background:radial-gradient(ellipse at center, #fffacd, #ffd700 70%, #daa520); border-radius:50% 50% 40% 40%;
}
.yuanbao::after{ content:'¥'; position:absolute; top:50%; left:50%; transform:translate(-50%, -40%); font-size:calc(18px * var(--scale)); font-weight:bold; color:#8b6914; }
.diamond{
    background:linear-gradient(135deg, #e0ffff 0%, #00ced1 30%, #008b8b 70%, #20b2aa 100%);
    clip-path:polygon(50% 0%, 100% 35%, 85% 100%, 15% 100%, 0% 35%); animation:diamondShine 2.5s infinite ease-in-out;
}
.diamond::after{ content:'💎'; font-size:calc(24px * var(--scale)); filter:drop-shadow(0 0 6px rgba(255,255,255,0.9)); transform:translateY(2px); }
@keyframes diamondShine{ 0%, 100%{ filter:brightness(1); } 50%{ filter:brightness(1.4); } }
.gift { background: linear-gradient(135deg, #ff4500, #ff0000); border-radius: 10px; box-shadow: 0 6px 14px rgba(255,0,0,0.35); }
.gift::after { content: '🎁'; font-size: calc(24px * var(--scale)); }
.crown{
    background:linear-gradient(to bottom, #ffd700, #ff8c00 60%, #ff6b00);
    clip-path:polygon(0% 75%, 8% 35%, 22% 55%, 38% 15%, 50% 45%, 62% 15%, 78% 55%, 92% 35%, 100% 75%, 100% 100%, 0% 100%); position:relative;
}
.crown::after{ content:'👑'; font-size:calc(22px * var(--scale)); position:absolute; top:55%; left:50%; transform:translate(-50%, -50%); }
.bomb{ background:radial-gradient(circle at 30% 30%, #777, #333 55%, #111); border-radius:50%; animation:bombPulse 1.8s infinite ease-in-out; position:relative; }
.bomb::before{ content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:10px; height:14px; background:linear-gradient(to right, #8b4513, #a0522d); border-radius:3px 3px 0 0; }
.bomb::after{ content:''; position:absolute; top:-18px; left:58%; width:8px; height:10px; background:radial-gradient(circle, #ff6347, #ff0000); border-radius:50%; box-shadow:0 0 12px #ff0000; animation:fuseBurn 0.6s infinite alternate; }
@keyframes bombPulse{ 0%, 100%{ box-shadow:0 0 30px rgba(255,0,0,0.5); } 50%{ box-shadow:0 0 45px rgba(255,0,0,0.75); } }
@keyframes fuseBurn{ 0%{ opacity:0.7; transform:scale(0.9); } 100%{ opacity:1; transform:scale(1.3); } }
#controls{ background:#111; border-top:3px solid gold; padding:calc(12px * var(--scale)); display:flex; justify-content:center; flex-shrink:0; }
button{ border:none; padding:calc(14px * var(--scale)) calc(40px * var(--scale)); border-radius:14px; font-size:calc(20px * var(--scale)); font-weight:bold; cursor:pointer; transition:0.2s; }
button:hover{ transform:scale(1.05); }
button:active{ transform:scale(0.95); }
.mineBtn{ background:#ff9800; color:#fff; box-shadow:0 4px 15px rgba(255,152,0,0.4); }
.reviveBtn{ background:#e53935; color:#fff; padding:calc(14px * var(--scale)) calc(28px * var(--scale)); font-size:calc(18px * var(--scale)); }
#exchangePanel{ display:none; margin-top:18px; flex-direction:column; align-items:center; gap:10px; }
.exchangeRow{ display:flex; gap:10px; align-items:center; }
#exchangeInput{ width:calc(130px * var(--scale)); padding:10px; border:none; border-radius:10px; font-size:calc(16px * var(--scale)); text-align:center; }
.exchangeBtn{ background:#2ecc71; color:#fff; padding:calc(12px * var(--scale)) calc(20px * var(--scale)); border-radius:12px; font-size:calc(16px * var(--scale)); }
#exchangeTip{ font-size:calc(15px * var(--scale)); color:#ff9800; }

/* 二维码弹窗 */
#qrModal{
    position:absolute; inset:0; background:rgba(0,0,0,0.92); display:none; z-index:600;
    justify-content:center; align-items:center; flex-direction:column;
}
#qrModal .qr-img-wrap{
    width:calc(280px * var(--scale));
    height:calc(280px * var(--scale));
    border-radius:16px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
}
#qrModal .qr-img-wrap canvas,
#qrModal .qr-img-wrap img {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    border-radius:12px;
}
.qr-text{ margin-top:calc(20px * var(--scale)); font-size:calc(22px * var(--scale)); color:#ffd700; }
.qr-timer{ margin-top:calc(15px * var(--scale)); font-size:calc(48px * var(--scale)); font-weight:bold; color:#ff6347; }

/* 游戏结束弹窗 */
#gameOver{ position:absolute; inset:0; background:rgba(0,0,0,0.88); display:none; z-index:500; justify-content:center; align-items:center; flex-direction:column; }
#gameOver h1{ font-size:calc(60px * var(--scale)); color:red; margin-bottom:calc(20px * var(--scale)); }
#gameOver p{ font-size:calc(28px * var(--scale)); margin-bottom:calc(30px * var(--scale)); }
</style>
</head>

<body>
<div id="gameWrap">
<div class="topBar">
    <div class="info">金币：<span id="handMoney">0</span></div>
    <div class="info">连击：<span id="combo">0</span></div>
    <div class="info">炸弹：<span id="bombCount">0</span>/3</div>
</div>

<div id="gameArea">
<div id="tip"></div>
<div class="miner">
    <div class="minerBody">
        <div class="logo-yuanbao">
            <div class="yb-ear-left"></div>
            <div class="yb-ear-right"></div>
            <div class="yb-body"></div>
            <div class="yb-top"></div>
            <div class="yb-shine"></div>
        </div>
    </div>
</div>
<div class="ropeWrap swing" id="ropeWrap">
    <div class="rope" id="rope"></div>
    <div class="claw" id="hook">
        <div class="claw-ring"></div>
        <div class="claw-connector"></div>
        <div class="claw-finger left"></div>
        <div class="claw-finger middle"></div>
        <div class="claw-finger right"></div>

</div>

<script>
/* =====================================================================
   ① 自适应缩放：以 414×896（手机竖屏基准）为设计尺寸，
      计算实际屏幕与设计尺寸的比例，写入 CSS --scale 变量，
      同时调整游戏内所有数值参数。
   ===================================================================== */
const BASE_W = 414;   // 设计基准宽度 (px)
const BASE_H = 896;   // 设计基准高度 (px)

let SCALE = 1;        // 全局缩放比（JS 物理计算用）
const ROPE_INIT_BASE = 140; // 初始绳长（设计尺寸下）

function applyScale(){
    const sw = window.innerWidth;
    const sh = window.innerHeight;
    SCALE = Math.min(sw / BASE_W, sh / BASE_H);
    SCALE = Math.max(0.45, Math.min(SCALE, 2.2)); // 限定合理范围
    document.documentElement.style.setProperty('--scale', SCALE);
}

applyScale();
window.addEventListener('resize', () => {
    applyScale();
    clearMines();
    initMines();
});

/* =====================================================================
   ② 二维码内联生成
      策略：直接把二维码以 Base64 形式硬编码在 JS 里，
            浏览器直接渲染，完全不依赖任何外部域名或网络请求。

   ★ 如何替换为你的真实二维码：
      1. 打开 https://www.base64-image.de/ 或本地工具，
         将你的二维码图片转为 Base64 字符串。
      2. 把下方 QR_BASE64 的值替换为你的完整 Base64 字符串。
         格式：'data:image/png;base64,<你的Base64字符串>'
      3. 保存并重新部署，无需其他任何改动。
   ===================================================================== */

// ↓↓↓ 将这里替换为你的真实二维码 Base64 字符串 ↓↓↓
const QR_BASE64 = null; // 设为 null 时将自动生成示意图
// const QR_BASE64 = 'data:image/png;base64,iVBORw0KGgo...（你的完整字符串）';
// ↑↑↑ 替换区域结束 ↑↑↑

function renderQRCode(){
    const wrap = document.getElementById('qrImgWrap');
    wrap.innerHTML = '';

    if(QR_BASE64){
        // 使用真实 Base64 二维码图片
        const img = document.createElement('img');
        img.src = QR_BASE64;
        img.alt = '付款二维码';
        wrap.appendChild(img);
    } else {
        // 自动生成示意用占位二维码（Canvas 绘制，无需网络）
        const canvas = document.createElement('canvas');
        const SIZE = 260;
        canvas.width = SIZE;
        canvas.height = SIZE;
        const ctx = canvas.getContext('2d');

        // 白底
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, SIZE, SIZE);

        // 使用简单几何图形模拟 QR 码外观
        ctx.fillStyle = '#222';

        // 外框
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 8;
        ctx.strokeRect(10, 10, SIZE-20, SIZE-20);

        // 三个定位角
        function drawCorner(x, y){
            ctx.fillStyle = '#222';
            ctx.fillRect(x, y, 52, 52);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x+8, y+8, 36, 36);
            ctx.fillStyle = '#222';
            ctx.fillRect(x+16, y+16, 20, 20);
        }
        drawCorner(22, 22);
        drawCorner(SIZE-74, 22);
        drawCorner(22, SIZE-74);

        // 模拟数据点（随机方块矩阵）
        const seed = 9527;
        function pseudoRand(i){ return ((i * 1103515245 + 12345) & 0x7fffffff) % 100; }
        const CELL = 8, OFF = 26, COLS = Math.floor((SIZE - OFF*2) / CELL);
        for(let r = 0; r < COLS; r++){
            for(let c = 0; c < COLS; c++){
                const px = OFF + c * CELL, py = OFF + r * CELL;
                // 跳过三个角落定位图形区域
                if((c < 7 && r < 7) || (c >= COLS-7 && r < 7) || (c < 7 && r >= COLS-7)) continue;
                if(pseudoRand(r * COLS + c + seed) < 50){
                    ctx.fillStyle = '#222';
                    ctx.fillRect(px, py, CELL-1, CELL-1);
                }
            }
        }

        // 中间提示文字
        ctx.font = 'bold 13px Microsoft YaHei, sans-serif';
        ctx.fillStyle = '#e53935';
        ctx.textAlign = 'center';
        ctx.fillText('⚠ 请替换为真实二维码', SIZE/2, SIZE - 16);

        wrap.appendChild(canvas);
    }
}

/* =====================================================================
   游戏逻辑（与原版完全一致，仅将所有固定像素值乘以 SCALE）
   ===================================================================== */
let handMoney=0, combo=0, bombCount=0, isHooking=false, mineList=[], lockAngle=0;
let ropeLen = ROPE_INIT_BASE * SCALE;
let playStartTime = Date.now();

const gameArea = document.getElementById('gameArea'),
      ropeWrap = document.getElementById('ropeWrap'),
      rope = document.getElementById('rope'),
      hook = document.getElementById('hook');
const handDom = document.getElementById('handMoney'),
      comboDom = document.getElementById('combo'),
      bombDom = document.getElementById('bombCount'),
      tip = document.getElementById('tip');

let tipTimer=null, qrCountdownTimer=null;

function updateUI(){
    handDom.innerText=handMoney;
    comboDom.innerText=combo;
    bombDom.innerText=bombCount;
}

function random(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function showTip(text){
    clearTimeout(tipTimer);
    tip.innerHTML=text;
    tip.style.opacity=1;
    tipTimer=setTimeout(()=>{ tip.style.opacity=0; },2000);
}

function createMine(){
    let item=document.createElement('div');
    let type=Math.random(), value=0, weight=0, className='', size=0;

    let elapsedSeconds = (Date.now() - playStartTime) / 1000;
    let bombThreshold = 0.22;
    if(elapsedSeconds >= 20){ bombThreshold = 0.66; }
    else if(elapsedSeconds >= 10){ bombThreshold = 0.44; }

    if(type < bombThreshold){
        className='item bomb'; value=0; weight=10; size=random(44,52);
    } else {
        let remain = (type - bombThreshold) / (1 - bombThreshold);
        if(remain < 0.38){
            className='item coin'; value=random(1,2); weight=5; size=random(38,46);
        } else if(remain < 0.68){
            className='item yuanbao'; value=random(3,6); weight=7; size=random(52,68);
        } else if(remain < 0.84){
            className='item diamond'; value=random(8,16); weight=4; size=random(42,55);
        } else if(remain < 0.93){
            className='item gift'; value=random(12,32); weight=6; size=random(44,52);
        } else {
            className='item crown'; value=random(27,55); weight=3; size=random(48,58);
        }
    }

    const scaledSize = Math.round(size * SCALE);
    item.className=className;
    item.style.width=scaledSize+'px';
    item.style.height=scaledSize+'px';
    item.style.left=random(25, gameArea.clientWidth - Math.round(100*SCALE))+'px';
    item.style.top=random(Math.round(gameArea.clientHeight*0.35), gameArea.clientHeight - Math.round(160*SCALE))+'px';

    item.dataset.value=value;
    item.dataset.weight=weight;
    gameArea.appendChild(item);
    mineList.push(item);
}

function initMines(){
    ropeLen = ROPE_INIT_BASE * SCALE;
    rope.style.height = ropeLen + 'px';
    const count = random(12, 14);
    for(let i=0; i<count; i++) createMine();
}

function clearMines(){
    mineList.forEach(item => item.parentNode && item.remove());
    mineList=[];
}

function getHookPoint(){
    const rad = lockAngle * Math.PI / 180;
    return {
        x: (gameArea.clientWidth / 2) + Math.sin(rad) * (ropeLen + 46*SCALE),
        y: 72*SCALE + Math.cos(rad) * (ropeLen + 46*SCALE)
    };
}

function getClawTipPoint(len, lateralOffset, forwardOffset){
    const rad = lockAngle * Math.PI / 180;
    const ux = Math.sin(rad);
    const uy = Math.cos(rad);
    const px = Math.cos(rad);
    const py = -Math.sin(rad);
    const baseX = gameArea.clientWidth / 2;
    const baseY = 72 * SCALE;
    const ls = lateralOffset * SCALE;
    const fs = forwardOffset * SCALE;
    return {
        x: baseX + ux * (len + fs) + px * ls,
        y: baseY + uy * (len + fs) + py * ls
    };
}

function getClawCatchSegments(prevLen, currLen){
    const fingers = [
        { lateral:-8, forward:51, priority:1 },
        { lateral: 0, forward:59, priority:0 },
        { lateral: 8, forward:51, priority:1 }
    ];
    return fingers.map(f => ({
        from:getClawTipPoint(prevLen, f.lateral, f.forward),
        to:getClawTipPoint(currLen, f.lateral, f.forward),
        priority:f.priority
    }));
}

function isPointInsideItemEllipse(point, rect, gameRect){
    const itemX = rect.left + rect.width / 2 - gameRect.left;
    const itemY = rect.top + rect.height / 2 - gameRect.top;
    const tolerance = 2;
    const rx = Math.max(8, rect.width / 2 + tolerance);
    const ry = Math.max(8, rect.height / 2 + tolerance);
    const nx = (point.x - itemX) / rx;
    const ny = (point.y - itemY) / ry;
    return (nx * nx + ny * ny) <= 1;
}

function segmentHitsItem(segment, rect, gameRect){
    const dx = segment.to.x - segment.from.x;
    const dy = segment.to.y - segment.from.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const steps = Math.max(1, Math.ceil(dist / 3));
    for(let i=0; i<=steps; i++){
        const t = i / steps;
        const point = { x: segment.from.x + dx*t, y: segment.from.y + dy*t };
        if(isPointInsideItemEllipse(point, rect, gameRect)){
            const itemX = rect.left + rect.width/2 - gameRect.left;
            const itemY = rect.top + rect.height/2 - gameRect.top;
            return Math.hypot(point.x-itemX, point.y-itemY) + segment.priority*4;
        }
    }
    return Infinity;
}

function throwHook(){
    if(isHooking) return;
    isHooking=true;

    const matrix = new DOMMatrix(window.getComputedStyle(ropeWrap).transform);
    lockAngle = Math.atan2(matrix.m21, matrix.m11) * 180 / Math.PI;

    ropeWrap.classList.remove('swing');
    ropeWrap.style.transform = `translateX(-50%) rotate(${lockAngle}deg)`;
    ropeLen = ROPE_INIT_BASE * SCALE;
    hook.classList.remove('closed');

    function extend(){
        const prevLen = ropeLen;
        ropeLen += 8 * SCALE;
        rope.style.height = ropeLen + 'px';
        ropeWrap.style.transform = `translateX(-50%) rotate(${lockAngle}deg)`;

        const target = detectCollision(prevLen, ropeLen);
        if(target){
            hook.classList.add('closed');
            pullBack(target);
            return;
        }
        if(ropeLen >= gameArea.clientHeight + 80*SCALE){
            pullBack(null);
            return;
        }
        requestAnimationFrame(extend);
    }
    extend();
}

function detectCollision(prevLen, currLen){
    const segments = getClawCatchSegments(prevLen, currLen);
    const gameRect = gameArea.getBoundingClientRect();
    let nearestTarget = null;
    let nearestScore = Infinity;
    for(let item of mineList){
        const rect = item.getBoundingClientRect();
        for(const segment of segments){
            const score = segmentHitsItem(segment, rect, gameRect);
            if(score < nearestScore){ nearestTarget=item; nearestScore=score; }
        }
    }
    return nearestTarget;
}

function pullBack(target){
    let speed = target ? parseInt(target.dataset.weight||10) * SCALE : 10 * SCALE;
    function retract(){
        ropeLen -= speed;
        rope.style.height = ropeLen + 'px';
        ropeWrap.style.transform = `translateX(-50%) rotate(${lockAngle}deg)`;
        if(target){
            const point = getHookPoint();
            target.style.left = (point.x - target.offsetWidth/2) + 'px';
            target.style.top = (point.y - target.offsetHeight/2) + 'px';
        }
        if(ropeLen <= ROPE_INIT_BASE*SCALE){
            finishGrab(target);
            return;
        }
        requestAnimationFrame(retract);
    }
    retract();
}

function finishGrab(target){
    hook.classList.remove('closed');
    if(target){
        if(target.className.includes('bomb')){
            bombCount++; combo=0;
            showTip(`💣 抓到炸弹 (${bombCount}/3)`);
            if(bombCount>=3){ gameOver(); return; }
        } else {
            let value = parseInt(target.dataset.value);
            combo++;
            let multi = combo>=10 ? 3 : combo>=6 ? 2 : combo>=3 ? 1.5 : 1;
            if(Math.random() > 0.9){ multi *= 2; showTip("🔥 暴击翻倍！"); }
            const final = Math.floor(value * multi);
            handMoney += final;
            showTip(target.className.includes('gift') ? `🎁 拆开精简礼盒！获得 ${final} 金币` : `获得 ${final} 金币`);
        }
        target.remove();
        mineList = mineList.filter(v=>v!==target);
        createMine();
    } else {
        combo=0;
        showTip("空钩返回");
    }
    resetHookState();
    updateUI();
}

function resetHookState(){
    ropeLen = ROPE_INIT_BASE * SCALE;
    rope.style.height = ropeLen + 'px';
    ropeWrap.style.transform = '';
    ropeWrap.classList.add('swing');
    isHooking=false;
}

function gameOver(){
    isHooking=true;
    document.getElementById('gameOver').style.display='flex';
}

function reviveGame(){
    if(handMoney >= 100){
        handMoney -= 100;
        bombCount=0; combo=0; isHooking=false;
        playStartTime = Date.now();
        clearMines(); initMines(); resetHookState();
        document.getElementById('gameOver').style.display='none';
        document.getElementById('exchangePanel').style.display='none';
        updateUI();
        showTip("❤️ 已复活！再来一局！");
    } else {
        document.getElementById('exchangePanel').style.display='flex';
        document.getElementById('exchangeTip').innerText = `还差 ${100-handMoney} 金币，可点击下方兑换支持`;
    }
}

function exchangeMoney(){
    document.getElementById('exchangePanel').style.display='none';
    document.getElementById('gameOver').style.display='none';
    const qrModal = document.getElementById('qrModal');
    const timerEl = document.getElementById('qrTimer');
    let count = 180;

    renderQRCode(); // 渲染内联二维码

    qrModal.style.display='flex';
    timerEl.innerText=count;

    clearInterval(qrCountdownTimer);
    qrCountdownTimer = setInterval(()=>{
        count--;
        timerEl.innerText=count;
        if(count<=0){
            clearInterval(qrCountdownTimer);
            handMoney=0; combo=0; bombCount=0; isHooking=false;
            playStartTime=Date.now();
            clearMines(); initMines(); resetHookState();
            document.getElementById('qrModal').style.display='none';
            updateUI();
            showTip("🔄 倒计时结束，新游戏开始！");
        }
    },1000);
}

updateUI();
initMines();
showTip("看准摇摆方向发射抓手！");
</script>

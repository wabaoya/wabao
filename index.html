<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>掘金挖宝-自适应版</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --scale: 1;
      --base-width: 414;
      --base-height: 896;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overscroll-behavior: none;
    }

    /* Game Container Scaled Dynamically */
    #game-container {
      position: relative;
      width: calc(414px * var(--scale));
      height: calc(896px * var(--scale));
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      border-radius: calc(16px * var(--scale));
    }

    #game-container.shake { animation: shakeKeyframes 0.4s ease; }
    @keyframes shakeKeyframes {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 4px); }
      40% { transform: translate(6px, -4px); }
      60% { transform: translate(-4px, -6px); }
      80% { transform: translate(4px, 6px); }
    }

    /* Scaling helper classes */
    .scaled-text-xs { font-size: calc(10px * var(--scale)); }
    .scaled-text-sm { font-size: calc(12px * var(--scale)); }
    .scaled-text-base { font-size: calc(14px * var(--scale)); }
    .scaled-text-lg { font-size: calc(18px * var(--scale)); }
    .scaled-text-xl { font-size: calc(22px * var(--scale)); }
    .scaled-text-2xl { font-size: calc(28px * var(--scale)); }
    .scaled-text-3xl { font-size: calc(36px * var(--scale)); }

    /* Top HUD Area */
    .hud-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(90px * var(--scale));
      padding: calc(10px * var(--scale)) calc(10px * var(--scale));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: calc(6px * var(--scale));
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 20;
      border-bottom: calc(2px * var(--scale)) solid rgba(255, 255, 255, 0.1);
    }

    .hud-box {
      background: rgba(255, 255, 255, 0.08);
      border: calc(1px * var(--scale)) solid rgba(255, 255, 255, 0.15);
      border-radius: calc(12px * var(--scale));
      padding: calc(6px * var(--scale)) calc(8px * var(--scale));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 0;
      min-width: 0;
    }

    .hud-box.hud-danger {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.35);
    }

    .hud-box span.hud-label {
      white-space: nowrap;
    }

    /* Miner Container */
    #miner-area {
      position: absolute;
      top: calc(90px * var(--scale));
      left: 0;
      width: 100%;
      height: calc(80px * var(--scale));
      display: flex;
      justify-content: center;
      align-items: flex-start;
      z-index: 15;
    }

    #miner {
      width: calc(60px * var(--scale));
      height: calc(60px * var(--scale));
      background: #f59e0b;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 calc(4px * var(--scale)) calc(12px * var(--scale)) rgba(245, 158, 11, 0.4);
      border: calc(3px * var(--scale)) solid #fbbf24;
      position: relative;
    }

    /* Volume Control */
    .volume-control {
      position: absolute;
      top: calc(6px * var(--scale));
      right: calc(10px * var(--scale));
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(4px * var(--scale));
    }

    #btn-mute {
      width: calc(34px * var(--scale));
      height: calc(34px * var(--scale));
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: calc(1px * var(--scale)) solid rgba(255, 255, 255, 0.2);
      color: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: calc(14px * var(--scale));
    }

    #volume-slider {
      width: calc(60px * var(--scale));
      transform: rotate(-90deg);
      margin: calc(24px * var(--scale)) calc(-14px * var(--scale));
      accent-color: #f59e0b;
      cursor: pointer;
    }

    /* Hook and Rope Canvas Layer */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Mine Field Items Container */
    #mine-field {
      position: absolute;
      top: calc(170px * var(--scale));
      left: 0;
      width: 100%;
      height: calc(626px * var(--scale));
      z-index: 5;
    }

    .item {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      transition: transform 0.1s ease;
      cursor: pointer;
      box-shadow: 0 calc(4px * var(--scale)) calc(8px * var(--scale)) rgba(0,0,0,0.3);
    }

    .item-gold {
      background: radial-gradient(circle at 30% 30%, #fef08a, #d97706);
      border: calc(2px * var(--scale)) solid #f59e0b;
      color: #78350f;
    }

    .item-stone {
      background: radial-gradient(circle at 30% 30%, #94a3b8, #334155);
      border: calc(2px * var(--scale)) solid #64748b;
      color: #e2e8f0;
      border-radius: 35%;
    }

    .item-diamond {
      background: radial-gradient(circle at 30% 30%, #e0f2fe, #0284c7);
      border: calc(2px * var(--scale)) solid #38bdf8;
      color: #ffffff;
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    }

    .item-bag {
      background: radial-gradient(circle at 30% 30%, #f472b6, #be185d);
      border: calc(2px * var(--scale)) solid #f43f5e;
      color: #fff;
      border-radius: 40% 40% 50% 50%;
    }

    .item-bomb {
      background: radial-gradient(circle at 35% 30%, #475569, #020617);
      border: calc(2px * var(--scale)) solid #7f1d1d;
      color: #fb7185;
      box-shadow: 0 0 calc(12px * var(--scale)) rgba(248, 113, 113, 0.55), 0 calc(4px * var(--scale)) calc(8px * var(--scale)) rgba(0,0,0,0.5);
      animation: bombPulse 1.1s ease-in-out infinite;
    }

    @keyframes bombPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }

    .explosion-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,214,102,0.55), rgba(239,68,68,0.25) 60%, transparent 80%);
      z-index: 40;
      pointer-events: none;
      animation: flashFade 0.3s ease-out forwards;
    }
    @keyframes flashFade { 0% { opacity: 1; } 100% { opacity: 0; } }

    .shard {
      position: absolute;
      width: calc(6px * var(--scale));
      height: calc(6px * var(--scale));
      border-radius: 2px;
      z-index: 35;
      pointer-events: none;
      animation: shardFly 0.5s ease-out forwards;
    }
    @keyframes shardFly {
      to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
    }

    /* Controls Area */
    .controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(110px * var(--scale));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 calc(16px * var(--scale));
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      z-index: 20;
      border-top: calc(2px * var(--scale)) solid rgba(255, 255, 255, 0.1);
    }

    .btn-action {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      font-weight: bold;
      border-radius: calc(16px * var(--scale));
      padding: calc(12px * var(--scale)) calc(24px * var(--scale));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(8px * var(--scale));
      box-shadow: 0 calc(4px * var(--scale)) calc(12px * var(--scale)) rgba(59, 130, 246, 0.4);
      border: calc(2px * var(--scale)) solid #60a5fa;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-action:active { transform: scale(0.95); }

    .btn-bomb {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-color: #fca5a5;
      box-shadow: 0 calc(4px * var(--scale)) calc(12px * var(--scale)) rgba(239, 68, 68, 0.4);
      justify-self: start;
      padding: calc(10px * var(--scale)) calc(14px * var(--scale));
    }

    .btn-grab-main {
      justify-self: center;
      width: calc(96px * var(--scale));
      height: calc(96px * var(--scale));
      border-radius: 50%;
      flex-direction: column;
      gap: calc(2px * var(--scale));
      padding: 0;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow: 0 calc(6px * var(--scale)) calc(20px * var(--scale)) rgba(59, 130, 246, 0.55);
      border: calc(3px * var(--scale)) solid #93c5fd;
      transform: translateY(calc(-14px * var(--scale)));
    }

    .btn-revive-big, .btn-deposit-big {
      width: 100%;
      justify-content: center;
      padding: calc(16px * var(--scale)) calc(24px * var(--scale));
      font-size: calc(17px * var(--scale));
      border-radius: calc(18px * var(--scale));
    }

    .btn-revive-big {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      border-color: #fda4af;
      box-shadow: 0 calc(4px * var(--scale)) calc(16px * var(--scale)) rgba(244, 63, 94, 0.5);
    }

    .btn-deposit-big {
      background: linear-gradient(135deg, #22c55e, #15803d);
      border-color: #86efac;
      box-shadow: 0 calc(4px * var(--scale)) calc(16px * var(--scale)) rgba(34, 197, 94, 0.5);
    }

    #recharge-amount-input {
      width: 100%;
      background: #ffffff;
      color: #0f172a;
      border-radius: calc(12px * var(--scale));
      padding: calc(10px * var(--scale)) calc(12px * var(--scale));
      border: none;
      font-weight: 600;
      text-align: center;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 85%;
      max-width: calc(360px * var(--scale));
      max-height: 85%;
      overflow-y: auto;
      background: #1e293b;
      border: calc(2px * var(--scale)) solid rgba(255, 255, 255, 0.15);
      border-radius: calc(24px * var(--scale));
      padding: calc(24px * var(--scale));
      text-align: center;
      box-shadow: 0 calc(20px * var(--scale)) calc(25px * var(--scale)) rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    #recharge-countdown-num {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- Main Game Canvas Container -->
  <div id="game-container">

    <!-- HUD Header -->
    <div class="hud-bar">
      <div class="hud-box">
        <span class="text-gray-400 scaled-text-xs font-semibold hud-label">当前得分</span>
        <span id="score-text" class="text-amber-400 scaled-text-xl font-black">0</span>
      </div>
      <div class="hud-box">
        <span class="text-gray-400 scaled-text-xs font-semibold hud-label">目标得分</span>
        <span id="target-text" class="text-emerald-400 scaled-text-xl font-black">100</span>
      </div>
      <div class="hud-box">
        <span class="text-gray-400 scaled-text-xs font-semibold hud-label">剩余时间</span>
        <span id="time-text" class="text-rose-400 scaled-text-xl font-black">60s</span>
      </div>
      <div class="hud-box hud-danger">
        <span class="text-rose-300 scaled-text-xs font-semibold hud-label">炸弹</span>
        <span id="bomb-hazard-text" class="text-rose-400 scaled-text-lg font-black">0/3</span>
      </div>
    </div>

    <!-- Miner Top Area -->
    <div id="miner-area">
      <div id="miner">
        <i class="fa-solid fa-user-ninja text-slate-900 scaled-text-2xl"></i>
      </div>
      <div class="volume-control">
        <button id="btn-mute" title="静音/取消静音">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.6">
      </div>
    </div>

    <!-- Rope & Hook Canvas Overlay -->
    <canvas id="canvas"></canvas>

    <!-- Underground Mining Field -->
    <div id="mine-field"></div>

    <!-- Bottom Action Controls -->
    <div class="controls-bar">
      <button id="btn-bomb" class="btn-action btn-bomb">
        <i class="fa-solid fa-bomb scaled-text-lg"></i>
        <span class="scaled-text-sm">炸弹 <span id="bomb-count">3</span></span>
      </button>

      <button id="btn-release" class="btn-action btn-grab-main">
        <i class="fa-solid fa-arrow-down scaled-text-lg"></i>
        <span class="scaled-text-sm">出爪</span>
      </button>

      <div></div>
    </div>

    <!-- Start Modal -->
    <div id="modal-start" class="modal-overlay active">
      <div class="modal-card">
        <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-500/30" style="width: calc(64px * var(--scale)); height: calc(64px * var(--scale));">
          <i class="fa-solid fa-gem scaled-text-3xl"></i>
        </div>
        <h2 class="text-white font-bold scaled-text-2xl mb-2">掘金挖宝</h2>
        <p class="text-gray-400 scaled-text-sm mb-6">看准角度发射钩爪，抓取地下珍贵宝藏！达成目标分数即可通关，但要小心炸弹——连续抓到 3 个炸弹游戏就会结束哦。</p>
        <button id="btn-start-game" class="btn-action w-full justify-center py-3">
          <span class="scaled-text-lg">开始挖宝</span>
        </button>
      </div>
    </div>

    <!-- Success Modal (target score reached) -->
    <div id="modal-success" class="modal-overlay">
      <div class="modal-card">
        <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" style="width: calc(64px * var(--scale)); height: calc(64px * var(--scale));">
          <i class="fa-solid fa-trophy scaled-text-3xl"></i>
        </div>
        <h2 class="text-emerald-400 font-bold scaled-text-2xl mb-2">挑战成功！</h2>
        <p id="success-desc" class="text-gray-400 scaled-text-sm mb-6">太棒了！您最终获得分数，成功解锁掘金专属宝藏礼包！</p>

  <!-- Background Music (loop). Replace assets/bgm-a-little-story.mp3 with your own licensed audio file. -->
  <audio id="bgm-audio" loop preload="auto">
    <source src="assets/bgm-a-little-story.mp3" type="audio/mpeg">
  </audio>

  <script>
    // =====================================================
    // Admin-configurable settings (read from localStorage,
    // written by admin.html on the same domain/origin)
    // =====================================================
    const DEFAULT_CONFIG = {
      targetScore: 100,
      bombsMax: 3,
      playerBombsCount: 3,
      reviveCost: 100,
      rechargeSeconds: 180,
      defaultVolume: 0.6,
      timeLimit: 60
    };
    let CONFIG = { ...DEFAULT_CONFIG };
    try {
      const savedConfig = JSON.parse(localStorage.getItem('game_config') || 'null');
      if (savedConfig) CONFIG = { ...DEFAULT_CONFIG, ...savedConfig };
    } catch (e) { /* ignore malformed config */ }

    // =====================================================
    // Dynamic Scaler Logic
    // =====================================================
    let SCALE = 1;
    const BASE_WIDTH = 414;
    const BASE_HEIGHT = 896;

    function updateScale() {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;

      SCALE = Math.min(windowW / BASE_WIDTH, windowH / BASE_HEIGHT);

      document.documentElement.style.setProperty('--scale', SCALE);

      const canvas = document.getElementById('canvas');
      const gameContainer = document.getElementById('game-container');
      if (canvas && gameContainer) {
        canvas.width = gameContainer.clientWidth;
        canvas.height = gameContainer.clientHeight;
      }

      if (gameState) {
        gameState.originX = (BASE_WIDTH / 2) * SCALE;
        gameState.originY = 120 * SCALE;
      }
    }

    window.addEventListener('resize', () => {
      updateScale();
      if (gameState && gameState.status === 'playing') {
        renderItems();
      }
    });
    window.addEventListener('orientationchange', updateScale);

    // =====================================================
    // Audio: background music + synthesized SFX
    // =====================================================
    const bgmAudio = document.getElementById('bgm-audio');
    const audioState = { muted: false, volume: CONFIG.defaultVolume };

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
      }
      return audioCtx;
    }

    function applyVolume() {
      bgmAudio.volume = audioState.muted ? 0 : audioState.volume;
      const icon = document.querySelector('#btn-mute i');
      icon.className = (audioState.muted || audioState.volume <= 0)
        ? 'fa-solid fa-volume-xmark'
        : (audioState.volume < 0.5 ? 'fa-solid fa-volume-low' : 'fa-solid fa-volume-high');
    }

    document.getElementById('btn-mute').addEventListener('click', () => {
      audioState.muted = !audioState.muted;
      applyVolume();
    });

    document.getElementById('volume-slider').value = audioState.volume;
    document.getElementById('volume-slider').addEventListener('input', (e) => {
      audioState.volume = parseFloat(e.target.value);
      if (audioState.volume > 0) audioState.muted = false;
      applyVolume();
    });

    applyVolume();

    function tryPlayBgm() {
      bgmAudio.loop = true;
      bgmAudio.play().catch(() => { /* blocked until user gesture; retried on next interaction */ });
    }
    document.addEventListener('pointerdown', tryPlayBgm, { once: true });

    function playExplosionSound() {
      if (audioState.muted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const vol = audioState.volume;

        // Low frequency thump
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.35);
        const oscGain = ctx.createGain();
        oscGain.gain.setValueAtTime(vol * 0.9, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(oscGain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);

        // Noise burst (crack)
        const bufferSize = Math.floor(ctx.sampleRate * 0.3);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(vol * 0.7, now);
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1400, now);
        noise.connect(filter).connect(noiseGain).connect(ctx.destination);
        noise.start(now);
      } catch (e) { /* audio not available */ }
    }

    // =====================================================
    // Game Physics & State Configuration
    // =====================================================
    const gameState = {
      status: 'idle', // idle, playing, ended
      score: 0,
      targetScore: CONFIG.targetScore,
      timeLeft: CONFIG.timeLimit,
      bombs: CONFIG.playerBombsCount,     // player's manual bomb tool charges
      bombsCaught: 0,                     // hazard bombs accidentally caught
      bombsMax: CONFIG.bombsMax,
      coins: 0,

      originX: 207,
      originY: 120,
      hookAngle: 0,
      angleSpeed: 0.03,
      angleDirection: 1,

      ropeLength: 30,
      minRopeLength: 30,
      maxRopeLength: 650,
      ropeSpeed: 8,

      hookState: 'swinging',
      caughtItem: null,

      timerId: null,
      rechargeTimerId: null,
      animFrameId: null
    };

    // Item Types Definition (Base Sizes and Values) — values tuned down so
    // reaching the 100-point target takes many careful catches.
    const ITEM_TYPES = [
      { type: 'gold', size: 30, value: 5, weight: 1.2, icon: 'fa-coins', class: 'item-gold' },
      { type: 'gold', size: 50, value: 10, weight: 2.2, icon: 'fa-coins', class: 'item-gold' },
      { type: 'gold', size: 70, value: 20, weight: 3.5, icon: 'fa-coins', class: 'item-gold' },
      { type: 'stone', size: 40, value: 2, weight: 3.0, icon: 'fa-mountain', class: 'item-stone' },
      { type: 'stone', size: 65, value: 4, weight: 4.8, icon: 'fa-mountain', class: 'item-stone' },
      { type: 'diamond', size: 28, value: 25, weight: 0.8, icon: 'fa-gem', class: 'item-diamond' },
      { type: 'bag', size: 35, value: 15, weight: 1.0, icon: 'fa-box-open', class: 'item-bag' },
      { type: 'bomb', size: 38, value: 0, weight: 1.0, icon: 'fa-bomb', class: 'item-bomb' }
    ];

    let items = [];

    // DOM References
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const mineField = document.getElementById('mine-field');
    const scoreText = document.getElementById('score-text');
    const targetText = document.getElementById('target-text');
    const timeText = document.getElementById('time-text');
    const bombCountText = document.getElementById('bomb-count');
    const bombHazardText = document.getElementById('bomb-hazard-text');

    // Item Generation Strategy
    function generateItems() {
      items = [];
      mineField.innerHTML = '';

      const count = 12 + Math.floor(Math.random() * 4); // 12-15 items
      const fieldWidth = BASE_WIDTH;
      const fieldHeight = 550;

      for (let i = 0; i < count; i++) {
        const typeIndex = Math.floor(Math.random() * ITEM_TYPES.length);
        const template = ITEM_TYPES[typeIndex];

        let x, y, overlap;
        let attempts = 0;

        do {
          overlap = false;
          x = template.size + Math.random() * (fieldWidth - template.size * 2);
          y = template.size + Math.random() * (fieldHeight - template.size * 2);

          for (const item of items) {
            const dist = Math.hypot(x - item.baseX, y - item.baseY);
            if (dist < (template.size + item.baseSize) / 2 + 10) {
              overlap = true;
              break;
            }
          }
          attempts++;
        } while (overlap && attempts < 100);

        const itemObj = {
          id: i,
          ...template,
          baseX: x,
          baseY: y,
          baseSize: template.size,
          caught: false
        };

        items.push(itemObj);
      }

      renderItems();
    }

    function renderItems() {
      mineField.innerHTML = '';
      items.forEach(item => {
        if (item.caught) return;

        const div = document.createElement('div');
        div.className = `item ${item.class}`;
        div.style.left = `calc(${item.baseX}px * var(--scale))`;
        div.style.top = `calc(${item.baseY}px * var(--scale))`;
        div.style.width = `calc(${item.baseSize}px * var(--scale))`;
        div.style.height = `calc(${item.baseSize}px * var(--scale))`;

        const icon = document.createElement('i');
        icon.className = `fa-solid ${item.icon} scaled-text-base`;
        div.appendChild(icon);

        mineField.appendChild(div);
        item.element = div;
      });
    }

    // Main Game Loop & Hook Physics calculation
    function gameLoop() {
      if (gameState.status !== 'playing') return;

      updateHookPhysics();
      drawRopeAndHook();

      gameState.animFrameId = requestAnimationFrame(gameLoop);
    }

    function updateHookPhysics() {
      if (gameState.hookState === 'swinging') {
        gameState.hookAngle += gameState.angleSpeed * gameState.angleDirection;
        if (gameState.hookAngle > Math.PI / 2.5) {
          gameState.hookAngle = Math.PI / 2.5;
          gameState.angleDirection = -1;
        } else if (gameState.hookAngle < -Math.PI / 2.5) {
          gameState.hookAngle = -Math.PI / 2.5;
          gameState.angleDirection = 1;
        }
      }
      else if (gameState.hookState === 'extending') {
        gameState.ropeLength += gameState.ropeSpeed * SCALE;

        const hookX = gameState.originX + Math.sin(gameState.hookAngle) * gameState.ropeLength;
        const hookY = gameState.originY + Math.cos(gameState.hookAngle) * gameState.ropeLength;

        if (
          hookX <= 15 * SCALE ||
          hookX >= (BASE_WIDTH - 15) * SCALE ||
          hookY >= (BASE_HEIGHT - 110) * SCALE ||
          gameState.ropeLength >= gameState.maxRopeLength * SCALE
        ) {
          gameState.hookState = 'retracting';
        }

        for (const item of items) {
          if (item.caught) continue;

          const itemCanvasX = item.baseX * SCALE;
          const itemCanvasY = (item.baseY + 170) * SCALE;
          const itemRadius = (item.baseSize / 2) * SCALE;

          const dist = Math.hypot(hookX - itemCanvasX, hookY - itemCanvasY);

          if (dist < itemRadius + (12 * SCALE)) {
            item.caught = true;
            if (item.element) item.element.style.display = 'none';

            if (item.type === 'bomb') {
              triggerExplosion(itemCanvasX, itemCanvasY);
              gameState.caughtItem = null;
              gameState.hookState = 'retracting';
              registerBombHit();
            } else {
              gameState.caughtItem = item;
              gameState.hookState = 'retracting';
            }
            break;
          }
        }
      }
      else if (gameState.hookState === 'retracting') {
        let currentSpeed = gameState.ropeSpeed;

        if (gameState.caughtItem) {
          currentSpeed = gameState.ropeSpeed / gameState.caughtItem.weight;
        }

        gameState.ropeLength -= currentSpeed * SCALE;

        if (gameState.ropeLength <= gameState.minRopeLength * SCALE) {
          gameState.ropeLength = gameState.minRopeLength * SCALE;
          gameState.hookState = 'swinging';

          if (gameState.caughtItem) {
            addScore(gameState.caughtItem.value);
            gameState.caughtItem = null;
          }
        }
      }
    }

    function drawRopeAndHook() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const hookX = gameState.originX + Math.sin(gameState.hookAngle) * gameState.ropeLength;
      const hookY = gameState.originY + Math.cos(gameState.hookAngle) * gameState.ropeLength;

      ctx.beginPath();
      ctx.moveTo(gameState.originX, gameState.originY);
      ctx.lineTo(hookX, hookY);
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = Math.max(2, 3 * SCALE);
      ctx.stroke();

      ctx.save();
      ctx.translate(hookX, hookY);
      ctx.rotate(-gameState.hookAngle);

      ctx.beginPath();
      ctx.arc(0, 0, 5 * SCALE, 0, Math.PI * 2);
      ctx.fillStyle = '#94a3b8';
      ctx.fill();

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = Math.max(2, 4 * SCALE);

      ctx.beginPath();
      ctx.moveTo(-2 * SCALE, 2 * SCALE);
      ctx.quadraticCurveTo(-14 * SCALE, 12 * SCALE, -8 * SCALE, 22 * SCALE);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(2 * SCALE, 2 * SCALE);
      ctx.quadraticCurveTo(14 * SCALE, 12 * SCALE, 8 * SCALE, 22 * SCALE);
      ctx.stroke();

      if (gameState.caughtItem) {
        const item = gameState.caughtItem;
        ctx.save();
        ctx.translate(0, (item.baseSize / 2 + 5) * SCALE);

        ctx.beginPath();
        ctx.arc(0, 0, (item.baseSize / 2) * SCALE, 0, Math.PI * 2);
        ctx.fillStyle = item.type === 'gold' ? '#f59e0b' : item.type === 'diamond' ? '#38bdf8' : '#64748b';
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    // Explosion visuals: blast ring + shard particles + screen shake + sound
    function triggerExplosion(centerX, centerY) {
      const blastRadius = 100 * SCALE;

      items.forEach(item => {
        if (item.caught) return;
        const itemCanvasX = item.baseX * SCALE;
        const itemCanvasY = (item.baseY + 170) * SCALE;
        const dist = Math.hypot(centerX - itemCanvasX, centerY - itemCanvasY);

        if (dist <= blastRadius) {
          item.caught = true;
          if (item.element) item.element.style.display = 'none';
        }
      });

      const gameContainer = document.getElementById('game-container');

      const blastDiv = document.createElement('div');
      blastDiv.style.position = 'absolute';
      blastDiv.style.left = `${centerX}px`;
      blastDiv.style.top = `${centerY}px`;
      blastDiv.style.transform = 'translate(-50%, -50%)';
      blastDiv.style.width = `calc(140px * var(--scale))`;
      blastDiv.style.height = `calc(140px * var(--scale))`;
      blastDiv.style.background = 'radial-gradient(circle, #fef08a 0%, #f97316 40%, #ef4444 65%, rgba(239,68,68,0) 100%)';
      blastDiv.style.borderRadius = '50%';
      blastDiv.style.zIndex = '30';
      blastDiv.style.pointerEvents = 'none';
      blastDiv.style.animation = 'flashFade 0.5s cubic-bezier(0, 0, 0.2, 1) forwards';
      gameContainer.appendChild(blastDiv);
      setTimeout(() => blastDiv.remove(), 500);

      const flash = document.createElement('div');
      flash.className = 'explosion-flash';
      gameContainer.appendChild(flash);
      setTimeout(() => flash.remove(), 300);

      for (let i = 0; i < 10; i++) {
        const shard = document.createElement('div');
        shard.className = 'shard';
        const angle = Math.random() * Math.PI * 2;
        const dist = (40 + Math.random() * 70) * SCALE;
        shard.style.left = `${centerX}px`;
        shard.style.top = `${centerY}px`;
        shard.style.background = Math.random() > 0.5 ? '#fbbf24' : '#f87171';
        shard.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        shard.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        shard.style.setProperty('--rot', `${Math.random() * 360}deg`);
        gameContainer.appendChild(shard);
        setTimeout(() => shard.remove(), 500);
      }

      gameContainer.classList.add('shake');
      setTimeout(() => gameContainer.classList.remove('shake'), 400);

      playExplosionSound();
    }

    function registerBombHit() {
      gameState.bombsCaught++;
      bombHazardText.textContent = `${gameState.bombsCaught}/${gameState.bombsMax}`;

      if (gameState.bombsCaught >= gameState.bombsMax) {
        setTimeout(() => endGame('bomb'), 550);
      }
    }

    // Player's manual bomb tool (blast whatever is currently on the hook)
    function useBomb() {
      if (gameState.bombs <= 0) return;
      if (gameState.hookState !== 'retracting' || !gameState.caughtItem) return;

      gameState.bombs--;
      bombCountText.textContent = gameState.bombs;

      const hookX = gameState.originX + Math.sin(gameState.hookAngle) * gameState.ropeLength;
      const hookY = gameState.originY + Math.cos(gameState.hookAngle) * gameState.ropeLength;

      triggerExplosion(hookX, hookY);

      gameState.caughtItem = null;
    }

    function addScore(value) {
      gameState.score += value;
      scoreText.textContent = gameState.score;

      if (gameState.status === 'playing' && gameState.score >= gameState.targetScore) {
        endGame('success');
      }
    }

    function startTimer() {
      clearInterval(gameState.timerId);
      gameState.timerId = setInterval(() => {
        gameState.timeLeft--;
        timeText.textContent = `${gameState.timeLeft}s`;

        if (gameState.timeLeft <= 0) {
          endGame('timeout');
        }
      }, 1000);
    }

    function releaseHook() {
      if (gameState.hookState === 'swinging' && gameState.status === 'playing') {
        gameState.hookState = 'extending';
      }
    }

    function hideAllEndModals() {
      document.getElementById('modal-start').classList.remove('active');
      document.getElementById('modal-success').classList.remove('active');
      document.getElementById('modal-gameover').classList.remove('active');
      document.getElementById('modal-recharge').classList.remove('active');
      document.getElementById('revive-extra').classList.add('hidden');
    }

    function startGame() {
      updateScale();
      clearInterval(gameState.rechargeTimerId);

      gameState.status = 'playing';
      gameState.score = 0;
      gameState.timeLeft = CONFIG.timeLimit;
      gameState.bombs = CONFIG.playerBombsCount;
      gameState.bombsCaught = 0;
      gameState.bombsMax = CONFIG.bombsMax;
      gameState.targetScore = CONFIG.targetScore;
      gameState.hookState = 'swinging';
      gameState.ropeLength = gameState.minRopeLength * SCALE;
      gameState.caughtItem = null;

      scoreText.textContent = '0';
      targetText.textContent = gameState.targetScore;
      timeText.textContent = `${gameState.timeLeft}s`;
      bombCountText.textContent = gameState.bombs;
      bombHazardText.textContent = `0/${gameState.bombsMax}`;

      hideAllEndModals();

      generateItems();
      startTimer();
      cancelAnimationFrame(gameState.animFrameId);
      gameLoop();

      tryPlayBgm();
    }

    function endGame(reason) {
      gameState.status = 'ended';
      clearInterval(gameState.timerId);
      cancelAnimationFrame(gameState.animFrameId);

      if (reason === 'success') {
        document.getElementById('success-desc').textContent =
          `太棒了！您最终获得 ${gameState.score} 分，成功解锁掘金专属宝藏礼包！`;
        document.getElementById('modal-success').classList.add('active');
        return;
      }

      // Failure states (timeout or 3 bombs caught) share the recharge flow
      const reasonEl = document.getElementById('gameover-reason');
      if (reason === 'bomb') {
        reasonEl.textContent = `你抓到了 ${gameState.bombsMax} 个炸弹！`;
      } else {
        reasonEl.textContent = `时间到！未达成 ${gameState.targetScore} 分目标（当前 ${gameState.score} 分）`;
      }

      document.getElementById('revive-extra').classList.add('hidden');
      gameState.coins = Math.max(0, Math.floor(gameState.score / 3));
      document.getElementById('modal-gameover').classList.add('active');
    }

    // Revive / recharge flow
    document.getElementById('btn-revive').addEventListener('click', () => {
      const need = Math.max(0, CONFIG.reviveCost - gameState.coins);
      if (need <= 0) {
        document.getElementById('modal-gameover').classList.remove('active');
        startGame();
        return;
      }
      document.getElementById('shortfall-text').textContent = `还差 ${need} 金币，可点击下方兑换支持`;
      document.getElementById('recharge-amount-input').value = need;
      document.getElementById('revive-extra').classList.remove('hidden');
    });

    document.getElementById('btn-deposit-exchange').addEventListener('click', () => {
      document.getElementById('modal-gameover').classList.remove('active');
      startRechargeCountdown();
    });

    function startRechargeCountdown() {
      let seconds = CONFIG.rechargeSeconds;
      const countdownEl = document.getElementById('recharge-countdown-num');
      countdownEl.textContent = seconds;
      document.getElementById('modal-recharge').classList.add('active');

      clearInterval(gameState.rechargeTimerId);
      gameState.rechargeTimerId = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(gameState.rechargeTimerId);
          document.getElementById('modal-recharge').classList.remove('active');
          startGame();
        }
      }, 1000);
    }

    document.getElementById('btn-skip-recharge').addEventListener('click', () => {
      clearInterval(gameState.rechargeTimerId);
      document.getElementById('modal-recharge').classList.remove('active');
      startGame();
    });

    document.getElementById('btn-restart-gameover').addEventListener('click', () => {
      document.getElementById('modal-gameover').classList.remove('active');
      startGame();
    });

    // Attach Event Handlers
    document.getElementById('btn-start-game').addEventListener('click', startGame);
    document.getElementById('btn-restart-success').addEventListener('click', startGame);
    document.getElementById('btn-release').addEventListener('click', releaseHook);
    document.getElementById('btn-bomb').addEventListener('click', useBomb);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowDown') {
        releaseHook();
      } else if (e.code === 'KeyB') {
        useBomb();
      }
    });

    document.getElementById('game-container').addEventListener('click', (e) => {
      if (e.target.closest('.btn-action') || e.target.closest('.modal-card') || e.target.closest('.volume-control')) return;
      releaseHook();
    });

    window.onload = function() {
      updateScale();
    };
  </script>
</body>
</html>
